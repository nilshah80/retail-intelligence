[project]
name = "retail-ml"
version = "0.1.0"
description = "Curated-data consumers: point-in-time features, forecast models and decision engines"
requires-python = ">=3.12"
dependencies = [
  "retail-contracts",
  "retail-intelligence-execution",
  "duckdb>=1.1",
  "pyarrow>=17",
  "pandas>=2.2",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Phase 3 adds lightgbm, statsmodels, scikit-learn and mlflow. Deliberately absent
# until features/models land, so the environment stays cheap to create in Phase 2.
dev = ["pytest>=8.0", "setuptools>=68", "wheel>=0.43"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
