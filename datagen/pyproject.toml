[project]
name = "retail-intelligence-datagen"
version = "0.13.0"
description = "Independent multi-market Shopify/Business Central synthetic source generator"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4,<2",
    "PyYAML>=6,<7",
    # Windows ships no IANA time zone database, so every ZoneInfo() call in this
    # package -- market timezones, local end-of-day observation stamps -- raises
    # ZoneInfoNotFoundError there. macOS and Linux read /usr/share/zoneinfo, which
    # is why the marker is win32-only rather than an unconditional dependency.
    # The other environments get this transitively through pandas; datagen has no
    # pandas, so it has to declare it.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
retail-datagen = "retail_datagen.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "retail_datagen",
    "retail_execution",
    "retail_execution.data",
    "retail_execution.data.v1",
]
package-dir = {retail_datagen = "src/retail_datagen", retail_execution = "../execution/src/retail_execution"}

[tool.setuptools.package-data]
retail_execution = ["data/v1/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "../execution/src"]
testpaths = ["tests"]
