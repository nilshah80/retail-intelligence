[project]
name = "retail-intelligence-datagen"
version = "0.9.2"
description = "Independent multi-market Shopify/Business Central synthetic source generator"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4,<2",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = []

[project.scripts]
retail-datagen = "retail_datagen.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
