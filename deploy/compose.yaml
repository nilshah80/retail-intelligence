name: retail-intelligence

services:
  postgres:
    image: postgres:17.10-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${RETAIL_POSTGRES_USER:-retail}
      POSTGRES_PASSWORD: ${RETAIL_POSTGRES_PASSWORD:-retail-local-only}
      POSTGRES_DB: ${RETAIL_POSTGRES_DB:-retail_intelligence}
    ports:
      - "127.0.0.1:${RETAIL_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready
          --username "$${POSTGRES_USER}"
          --dbname "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - retail-backend

  mlflow:
    build:
      context: ./mlflow
      args:
        MLFLOW_VERSION: "3.14.0"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - >-
        postgresql+psycopg://${RETAIL_POSTGRES_USER:-retail}:${RETAIL_POSTGRES_PASSWORD:-retail-local-only}@postgres:5432/${RETAIL_POSTGRES_DB:-retail_intelligence}
      - --artifacts-destination
      - /mlartifacts
      - --workers
      - ${MLFLOW_WORKERS:-2}
      - --allowed-hosts
      - ${MLFLOW_ALLOWED_HOSTS:-localhost:*,127.0.0.1:*}
      - --cors-allowed-origins
      - ${MLFLOW_CORS_ALLOWED_ORIGINS:-http://localhost:5000,http://127.0.0.1:5000}
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow-artifacts:/mlartifacts
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:5000/health", timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - retail-backend

volumes:
  postgres-data:
  mlflow-artifacts:

networks:
  retail-backend:
    driver: bridge
