        versionId:
          type: string
          pattern: ^fv_[0-9a-f]{16}$
        forecastRunId:
          type: string
          pattern: ^fr_[0-9a-f]{16}$
        semanticFingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
        publicationFingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
        activationScopeFingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
        decisionAsOf:
          type: string
          format: date-time
        markets:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string}
        capabilities:
          type: object
          additionalProperties: false
          required: [demandForecastNonPit, pointInTimeForecasting]
