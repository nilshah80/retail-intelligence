openapi: 3.1.0
info:
  title: Retail Intelligence API
  version: 0.3.1
  description: >-
    Read-only data-management and Phase 3 forecast API. Forecast routes serve
    only an explicitly activated PostgreSQL projection produced from an
    accepted, fully verified ten-artifact forecast bundle.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: health
      responses:
        "200":
          description: Process is ready.
          content:
            application/json:
              schema: {type: object}
  /api/v1/data-management/summary:
    get:
      operationId: dataManagementSummary
      responses:
        "200":
          description: Accepted landing and curated publication summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataManagementSummary"
  /api/v1/data-management/dashboard:
    get:
      operationId: dataManagementDashboard
      responses:
        "200":
          description: Original Data Management screen backed by accepted evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataManagementDashboard"
  /api/v1/data-management/gates:
    get:
      operationId: qualityGates
      responses:
        "200":
          description: Machine-readable Gate A and Gate B reports.
          content:
            application/json:
              schema: {type: object}
  /api/v1/data-management/capabilities:
    get:
      operationId: capabilityMask
      responses:
        "200":
          description: Published capability availability and reason codes.
          content:
            application/json:
              schema: {type: object}
  /api/v1/data-management/reconciliation:
    get:
      operationId: reconciliation
      responses:
        "200":
          description: Exact per-currency source-to-canonical controls.
          content:
            application/json:
              schema:
                type: array
                items: {type: object}
  /api/v1/data-management/quality-findings:
    get:
      operationId: qualityFindings
      responses:
        "200":
          description: Warnings, capability downgrades and critical findings.
          content:
            application/json:
              schema:
                type: array
                items: {type: object}
  /api/v1/fx/rates:
    get:
      operationId: fxRates
      responses:
        "200":
          description: Accepted as-of FX rates into the retailer reporting currency.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FxRates"
  /api/v1/forecast/versions:
    get:
      operationId: forecastVersions
      responses:
        "200":
          $ref: "#/components/responses/ForecastLive"
        "409":
          $ref: "#/components/responses/ForecastStale"
        "503":
          $ref: "#/components/responses/ForecastUnavailable"
  /api/v1/forecast/summary:
    get:
      operationId: forecastSummary
      responses:
        "200":
          $ref: "#/components/responses/ForecastLive"
        "409":
          $ref: "#/components/responses/ForecastStale"
        "503":
          $ref: "#/components/responses/ForecastUnavailable"
  /api/v1/forecast/series:
    get:
      operationId: forecastSeries
      description: >-
        Returns the per-horizon series rows by default, or the aggregated SKU
        workbench row when `view=workbench`. Workbench items additionally satisfy
        `#/components/schemas/ForecastWorkbenchIntervalScope`, which frozen
        decision #64 Q19 requires every interval-bearing aggregate to carry.
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastRegion"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastChannel"}
        - {$ref: "#/components/parameters/ForecastChannelType"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastHorizon"}
        - {$ref: "#/components/parameters/ForecastHorizonWeeks"}
        - {$ref: "#/components/parameters/ForecastView"}
        - {$ref: "#/components/parameters/ForecastSearch"}
        - {$ref: "#/components/parameters/ForecastOffset"}
        - {$ref: "#/components/parameters/ForecastLimit"}
      responses:
        "200":
          $ref: "#/components/responses/ForecastLive"
        "409":
          $ref: "#/components/responses/ForecastStale"
        "503":
          $ref: "#/components/responses/ForecastUnavailable"
  /api/v1/forecast/actuals:
    get:
      operationId: forecastActuals
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastRegion"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastChannel"}
        - {$ref: "#/components/parameters/ForecastChannelType"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastHorizon"}
        - {$ref: "#/components/parameters/ForecastView"}
        - {$ref: "#/components/parameters/ForecastSearch"}
        - {$ref: "#/components/parameters/ForecastOffset"}
        - {$ref: "#/components/parameters/ForecastLimit"}
      responses:
        "200":
          $ref: "#/components/responses/ForecastLive"
        "409":
          $ref: "#/components/responses/ForecastStale"
        "503":
          $ref: "#/components/responses/ForecastUnavailable"
  /api/v1/forecast/horizons:
    get:
      operationId: forecastHorizons
      description: >-
        Filter-scoped additive metrics. The server always SUMs governed
        components before dividing.
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastRegion"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastChannel"}
        - {$ref: "#/components/parameters/ForecastChannelType"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastHorizon"}
        - {$ref: "#/components/parameters/ForecastSearch"}
      responses:
        "200":
          $ref: "#/components/responses/ForecastLive"
        "409":
          $ref: "#/components/responses/ForecastStale"
        "503":
          $ref: "#/components/responses/ForecastUnavailable"
  /api/v1/forecast/stores:
    get:
      operationId: forecastStores
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastRegion"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastChannel"}
        - {$ref: "#/components/parameters/ForecastChannelType"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastHorizonWeeks"}
        - {$ref: "#/components/parameters/ForecastSearch"}
      responses:
        "200":
          $ref: "#/components/responses/ForecastLive"
        "409":
          $ref: "#/components/responses/ForecastStale"
        "503":
          $ref: "#/components/responses/ForecastUnavailable"
  /api/v1/forecast/drivers:
    get:
      operationId: forecastDrivers
      parameters:
        - name: scope
          in: query
          schema: {type: string}
          description: Exact governed driver scope; defaults to portfolio.
      responses:
        "200":
          $ref: "#/components/responses/ForecastLive"
        "409":
          $ref: "#/components/responses/ForecastStale"
        "503":
          $ref: "#/components/responses/ForecastUnavailable"
  /api/v1/forecast/signals:
    get:
      operationId: forecastSignals
      responses:
        "200":
          $ref: "#/components/responses/ForecastLive"
        "409":
          $ref: "#/components/responses/ForecastStale"
        "503":
          $ref: "#/components/responses/ForecastUnavailable"
  /api/v1/forecast/exceptions:
    get:
      operationId: forecastExceptions
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastChannel"}
        - {$ref: "#/components/parameters/ForecastSearch"}
        - name: exceptionClass
          in: query
          schema: {type: string}
        - {$ref: "#/components/parameters/ForecastOffset"}
        - {$ref: "#/components/parameters/ForecastLimit"}
      responses:
        "200":
          $ref: "#/components/responses/ForecastLive"
        "409":
          $ref: "#/components/responses/ForecastStale"
        "503":
          $ref: "#/components/responses/ForecastUnavailable"
  /api/v1/inventory/versions:
    get:
      operationId: inventoryVersions
      description: >-
        Active inventory/replenishment version, lineage and capability state. Serves only the explicitly activated, lineage-matching
        PostgreSQL projection of one accepted inventory/replenishment run;
        fails closed otherwise.
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastSearch"}
        - {$ref: "#/components/parameters/ForecastOffset"}
        - {$ref: "#/components/parameters/ForecastLimit"}
      responses:
        "200":
          $ref: "#/components/responses/InventoryLive"
        "409":
          $ref: "#/components/responses/InventoryStale"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"
  /api/v1/inventory/overview:
    get:
      operationId: inventoryOverview
      description: >-
        Market/location position, health, risk and replay summary. Serves only the explicitly activated, lineage-matching
        PostgreSQL projection of one accepted inventory/replenishment run;
        fails closed otherwise.
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastSearch"}
        - {$ref: "#/components/parameters/ForecastOffset"}
        - {$ref: "#/components/parameters/ForecastLimit"}
      responses:
        "200":
          $ref: "#/components/responses/InventoryLive"
        "409":
          $ref: "#/components/responses/InventoryStale"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"
  /api/v1/inventory/stores:
    get:
      operationId: inventoryStores
      description: >-
        Store-grain position, availability, days of supply and risk. Serves only the explicitly activated, lineage-matching
        PostgreSQL projection of one accepted inventory/replenishment run;
        fails closed otherwise.
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastSearch"}
        - {$ref: "#/components/parameters/ForecastOffset"}
        - {$ref: "#/components/parameters/ForecastLimit"}
      responses:
        "200":
          $ref: "#/components/responses/InventoryLive"
        "409":
          $ref: "#/components/responses/InventoryStale"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"
  /api/v1/inventory/warehouses:
    get:
      operationId: inventoryWarehouses
      description: >-
        DC position, valuation, utilization and receipt state. Serves only the explicitly activated, lineage-matching
        PostgreSQL projection of one accepted inventory/replenishment run;
        fails closed otherwise.
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastSearch"}
        - {$ref: "#/components/parameters/ForecastOffset"}
        - {$ref: "#/components/parameters/ForecastLimit"}
      responses:
        "200":
          $ref: "#/components/responses/InventoryLive"
        "409":
          $ref: "#/components/responses/InventoryStale"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"
  /api/v1/inventory/ageing:
    get:
      operationId: inventoryAgeing
      description: >-
        Age buckets and the deterministic action ladder, including de-assorted residual stock. Serves only the explicitly activated, lineage-matching
        PostgreSQL projection of one accepted inventory/replenishment run;
        fails closed otherwise.
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastSearch"}
        - {$ref: "#/components/parameters/ForecastOffset"}
        - {$ref: "#/components/parameters/ForecastLimit"}
      responses:
        "200":
          $ref: "#/components/responses/InventoryLive"
        "409":
          $ref: "#/components/responses/InventoryStale"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"
  /api/v1/inventory/transfers:
    get:
      operationId: inventoryTransfers
      description: >-
        Current transfer recommendations over typed lanes. Serves only the explicitly activated, lineage-matching
        PostgreSQL projection of one accepted inventory/replenishment run;
        fails closed otherwise.
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastSearch"}
        - {$ref: "#/components/parameters/ForecastOffset"}
        - {$ref: "#/components/parameters/ForecastLimit"}
      responses:
        "200":
          $ref: "#/components/responses/InventoryLive"
        "409":
          $ref: "#/components/responses/InventoryStale"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"
  /api/v1/inventory/valuation:
    get:
      operationId: inventoryValuation
      description: >-
        Gross valuation and DC-only ERP-vs-WMS variance; NRV and provisions are unavailable per P4-D10. Serves only the explicitly activated, lineage-matching
        PostgreSQL projection of one accepted inventory/replenishment run;
        fails closed otherwise.
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastSearch"}
        - {$ref: "#/components/parameters/ForecastOffset"}
        - {$ref: "#/components/parameters/ForecastLimit"}
      responses:
        "200":
          $ref: "#/components/responses/InventoryLive"
        "409":
          $ref: "#/components/responses/InventoryStale"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"
  /api/v1/inventory/expiry-waste:
    get:
      operationId: inventoryExpiryWaste
      description: >-
        Expiry-window exposure and waste actuals for shelf-life-bearing SKUs. Serves only the explicitly activated, lineage-matching
        PostgreSQL projection of one accepted inventory/replenishment run;
        fails closed otherwise.
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastSearch"}
        - {$ref: "#/components/parameters/ForecastOffset"}
        - {$ref: "#/components/parameters/ForecastLimit"}
      responses:
        "200":
          $ref: "#/components/responses/InventoryLive"
        "409":
          $ref: "#/components/responses/InventoryStale"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"
  /api/v1/inventory/stock-health:
    get:
      operationId: inventoryStockHealth
      description: >-
        Eight-column SKU x store triage table. Serves only the explicitly activated, lineage-matching
        PostgreSQL projection of one accepted inventory/replenishment run;
        fails closed otherwise.
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastSearch"}
        - {$ref: "#/components/parameters/ForecastOffset"}
        - {$ref: "#/components/parameters/ForecastLimit"}
      responses:
        "200":
          $ref: "#/components/responses/InventoryLive"
        "409":
          $ref: "#/components/responses/InventoryStale"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"
  /api/v1/replenishment/planner:
    get:
      operationId: replenishmentPlanner
      description: >-
        Replenishment planner rows with lane, term, capacity and budget guards. Serves only the explicitly activated, lineage-matching
        PostgreSQL projection of one accepted inventory/replenishment run;
        fails closed otherwise.
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastSearch"}
        - {$ref: "#/components/parameters/ForecastOffset"}
        - {$ref: "#/components/parameters/ForecastLimit"}
      responses:
        "200":
          $ref: "#/components/responses/InventoryLive"
        "409":
          $ref: "#/components/responses/InventoryStale"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"
  /api/v1/replenishment/orders:
    get:
      operationId: replenishmentOrders
      description: >-
        Read-only suggested orders; ERP status is shadow_not_sent. Serves only the explicitly activated, lineage-matching
        PostgreSQL projection of one accepted inventory/replenishment run;
        fails closed otherwise.
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastSearch"}
        - {$ref: "#/components/parameters/ForecastOffset"}
        - {$ref: "#/components/parameters/ForecastLimit"}
      responses:
        "200":
          $ref: "#/components/responses/InventoryLive"
        "409":
          $ref: "#/components/responses/InventoryStale"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"
  /api/v1/replenishment/suppliers:
    get:
      operationId: replenishmentSuppliers
      description: >-
        Supplier performance, capacity confirmation and risk. Serves only the explicitly activated, lineage-matching
        PostgreSQL projection of one accepted inventory/replenishment run;
        fails closed otherwise.
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastSearch"}
        - {$ref: "#/components/parameters/ForecastOffset"}
        - {$ref: "#/components/parameters/ForecastLimit"}
      responses:
        "200":
          $ref: "#/components/responses/InventoryLive"
        "409":
          $ref: "#/components/responses/InventoryStale"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"
  /api/v1/replenishment/safety-stock:
    get:
      operationId: replenishmentSafetyStock
      description: >-
        Safety-stock segments from the hard-gated interval; a withheld interval row is skipped with its governed exception, never zero. Serves only the explicitly activated, lineage-matching
        PostgreSQL projection of one accepted inventory/replenishment run;
        fails closed otherwise.
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastSearch"}
        - {$ref: "#/components/parameters/ForecastOffset"}
        - {$ref: "#/components/parameters/ForecastLimit"}
      responses:
        "200":
          $ref: "#/components/responses/InventoryLive"
        "409":
          $ref: "#/components/responses/InventoryStale"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"
  /api/v1/replenishment/allocations:
    get:
      operationId: replenishmentAllocations
      description: >-
        Constrained channel allocation over one node ATP pool. Serves only the explicitly activated, lineage-matching
        PostgreSQL projection of one accepted inventory/replenishment run;
        fails closed otherwise.
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastSearch"}
        - {$ref: "#/components/parameters/ForecastOffset"}
        - {$ref: "#/components/parameters/ForecastLimit"}
      responses:
        "200":
          $ref: "#/components/responses/InventoryLive"
        "409":
          $ref: "#/components/responses/InventoryStale"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"
  /api/v1/replenishment/exceptions:
    get:
      operationId: replenishmentExceptions
      description: >-
        Deterministic engine-derived exceptions; workflow fields are unavailable. Serves only the explicitly activated, lineage-matching
        PostgreSQL projection of one accepted inventory/replenishment run;
        fails closed otherwise.
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastSearch"}
        - {$ref: "#/components/parameters/ForecastOffset"}
        - {$ref: "#/components/parameters/ForecastLimit"}
      responses:
        "200":
          $ref: "#/components/responses/InventoryLive"
        "409":
          $ref: "#/components/responses/InventoryStale"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"
components:
  parameters:
    ForecastMarket:
      name: marketId
      in: query
      schema: {type: string}
    ForecastRegion:
      name: region
      in: query
      schema: {type: string}
    ForecastStore:
      name: storeId
      in: query
      schema: {type: string}
    ForecastChannel:
      name: channelId
      in: query
      schema: {type: string}
    ForecastChannelType:
      name: channelType
      in: query
      schema: {type: string, enum: [online, store]}
    ForecastCategory:
      name: category
      in: query
      schema: {type: string}
    ForecastHorizon:
      name: horizon
      in: query
      schema: {type: integer, minimum: 0, maximum: 26, default: 0}
    ForecastHorizonWeeks:
      name: horizonWeeks
      in: query
      description: Inclusive future-horizon cap used by aggregated projections.
      schema: {type: integer, minimum: 1, maximum: 26, default: 4}
    ForecastView:
      name: view
      in: query
      description: Optional UI projection; unsupported values retain the raw resource.
      schema: {type: string, enum: [raw, workbench, weekly]}
    ForecastSearch:
      name: search
      in: query
      schema: {type: string, maxLength: 200}
    ForecastOffset:
      name: offset
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    ForecastLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
  responses:
    ForecastLive:
      description: >-
        Live data from the explicitly activated, lineage-matching PostgreSQL
        forecast projection.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ForecastLive"
    ForecastUnavailable:
      description: >-
        Forecast data is unavailable because no fully verified forecast read
        model can be served.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ForecastUnavailable"
    InventoryLive:
      description: >-
        Live data from the explicitly activated, lineage-matching PostgreSQL
        inventory/replenishment projection.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InventoryLive"
    InventoryUnavailable:
      description: >-
        Inventory data is unavailable because no fully verified
        inventory/replenishment read model can be served.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InventoryUnavailable"
    InventoryStale:
      description: >-
        An activated inventory version exists, but its lineage is stale or
        superseded and cannot be served.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InventoryUnavailable"
    ForecastStale:
      description: >-
        An activated forecast exists, but its curated-publication lineage is
        stale or superseded and cannot be served.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ForecastUnavailable"
  schemas:
    ForecastLive:
      type: object
      required:
        - schemaVersion
        - dataMode
        - versionId
        - forecastRunId
        - semanticFingerprint
        - publicationFingerprint
        - activationScopeFingerprint
        - decisionAsOf
        - markets
        - capabilities
        - items
      properties:
        schemaVersion:
          type: string
          pattern: ^retail-forecast-[a-z-]+/v1$
        dataMode: {const: live}
        versionId:
          type: string
          pattern: ^fv_[0-9a-f]{16}$
        forecastRunId:
          type: string
          pattern: ^fr_[0-9a-f]{16}$
        semanticFingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
        publicationFingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
        activationScopeFingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
        decisionAsOf:
          type: string
          format: date-time
        markets:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string}
        capabilities:
          type: object
          additionalProperties: false
          required: [demandForecastNonPit, pointInTimeForecasting]
          properties:
            demandForecastNonPit:
              type: object
              additionalProperties: false
              required: [available]
              properties:
                available: {const: true}
            pointInTimeForecasting:
              type: object
              additionalProperties: false
              required: [available, reasonCode]
              properties:
                available: {const: false}
                reasonCode: {const: LANDING_BACKFILL_DEPENDENCY}
        items:
          type: array
          items: {type: object}
        unavailableItems:
          type: array
          items: {type: object}
        freshnessBaseline:
          type: string
          format: date-time
        pagination:
          type: object
          additionalProperties: false
          required: [offset, limit, total]
          properties:
            offset: {type: integer, minimum: 0}
            limit: {type: integer, minimum: 1, maximum: 1000}
            total: {type: integer, minimum: 0}
    ForecastWorkbenchIntervalScope:
      description: >-
        The interval-scope contract for the SKU workbench row, frozen by decision
        #64 Q19 and parity amendment P4-0P-A1.

        Decision #92 publishes the cold-start P90 and its derived confidence only
        within the calibrated h1-h4 range and retains P50 at all 26 horizons, so a
        selected window of 8, 13 or 26 weeks mixes horizons that carry an interval
        with horizons that do not. `SUM` skips nulls, so before this contract the
        weighted-confidence numerator omitted the withheld weeks while its
        denominator still counted their retained P50 weight, and the interval total
        covered fewer weeks than the central total displayed beside it.

        These fields exist so a mixed window is an explicit, explicable
        unavailable state rather than a silently blended number. A consumer must
        never read an absent interval as zero spread.
      type: object
      required:
        - confidenceState
        - aiForecastP90State
        - intervalWithheldWeeks
      properties:
        confidence:
          description: >-
            The max(P50,1)-weighted mean of per-row confidence per decision #12.
            Null when `confidenceState` is `unavailable_mixed_window`.
          type: [number, "null"]
        confidenceState:
          type: string
          enum: [measured, unavailable_mixed_window]
        confidenceCoveredWindowMean:
          description: >-
            Diagnostic, never the display value. The arithmetically corrected
            weighted mean restricted to the weeks that carry an interval on both
            sides of the ratio. Rendered nowhere; the workbench Confidence cell is
            unavailable when the window is mixed.
          type: [number, "null"]
        aiForecastP90:
          description: >-
            Sum of weekly upper bounds over the selected window. Null when the
            window contains a withheld week: a sum of P90 bounds is not the P90 of
            the sum, so scoping it to the covered weeks would not make the label
            true.
          type: [number, "null"]
        aiForecastP90State:
          type: string
          enum: [available, unavailable_mixed_window]
        intervalCoveredFromHorizon:
          type: [integer, "null"]
          minimum: 1
          maximum: 26
        intervalCoveredThroughHorizon:
          type: [integer, "null"]
          minimum: 1
          maximum: 26
        intervalWithheldWeeks:
          description: Count of selected horizons with no published interval.
          type: integer
          minimum: 0
        intervalUnavailableReason:
          type: [string, "null"]
          enum: [COLD_START_INTERVAL_UNCALIBRATED, null]
    InventoryLive:
      type: object
      required:
        - schemaVersion
        - dataMode
        - inventoryRunId
        - inventoryVersionId
        - semanticFingerprint
        - forecastAuthority
        - policyVersion
        - markets
        - items
      properties:
        schemaVersion:
          type: string
          pattern: ^retail-inventory-[a-z-]+/v1$
        dataMode: {const: live}
        inventoryRunId:
          type: string
          pattern: ^ir_[0-9a-f]{16}$
        inventoryVersionId:
          type: string
          pattern: ^iv_[0-9a-f]{16}$
        semanticFingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
        forecastAuthority:
          description: >-
            The exactly-one active forecast this bundle consumed. Serving
            refuses when this no longer matches the live forecast authority:
            an inventory number computed from a superseded forecast is stale by
            definition.
          type: object
          required: [forecastRunId, forecastVersionId]
          properties:
            forecastRunId:
              type: string
              pattern: ^fr_[0-9a-f]{16}$
            forecastVersionId:
              type: string
              pattern: ^fv_[0-9a-f]{16}$
        policyVersion: {const: inventory-policy/2.0.0}
        markets:
          type: array
          minItems: 1
          items: {type: string}
        items:
          type: array
          items: {type: object}
        unavailableItems:
          type: array
          items: {type: object}
        pagination:
          type: object
          additionalProperties: false
          required: [offset, limit, total]
          properties:
            offset: {type: integer, minimum: 0}
            limit: {type: integer, minimum: 1, maximum: 1000}
            total: {type: integer, minimum: 0}
    InventoryUnavailable:
      type: object
      additionalProperties: false
      required: [schemaVersion, dataMode, reasonCode, message, capabilities]
      properties:
        schemaVersion: {const: retail-inventory-unavailable/v1}
        dataMode: {const: unavailable}
        inventoryRunId: {type: "null"}
        inventoryVersionId: {type: "null"}
        semanticFingerprint: {type: "null"}
        reasonCode: {type: string}
        message: {type: string}
        capabilities:
          type: object
          required:
            - inventoryReplenishmentCurrentSnapshot
            - inventoryReplenishmentReplay
          properties:
            inventoryReplenishmentCurrentSnapshot:
              type: object
              required: [available]
              properties:
                available: {type: boolean}
                reasonCode: {type: [string, "null"]}
            inventoryReplenishmentReplay:
              type: object
              required: [available]
              properties:
                available: {type: boolean}
                reasonCode: {type: [string, "null"]}
    ForecastUnavailable:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - dataMode
        - versionId
        - forecastRunId
        - semanticFingerprint
        - reasonCode
        - message
        - capabilities
      properties:
        schemaVersion: {const: retail-forecast-unavailable/v1}
        dataMode: {const: unavailable}
        versionId: {type: ["string", "null"]}
        forecastRunId: {type: ["string", "null"]}
        semanticFingerprint: {type: ["string", "null"]}
        reasonCode:
          type: string
          enum:
            - FORECAST_ARTIFACT_INVALID
            - FORECAST_LINEAGE_MISMATCH
            - FORECAST_READ_MODEL_UNAVAILABLE
        message: {type: string, minLength: 1}
        capabilities:
          type: object
          additionalProperties: false
          required: [demandForecastNonPit, pointInTimeForecasting]
          properties:
            demandForecastNonPit:
              type: object
              additionalProperties: false
              required: [available, reasonCode]
              properties:
                available: {const: false}
                reasonCode: {type: string, minLength: 1}
            pointInTimeForecasting:
              type: object
              additionalProperties: false
              required: [available, reasonCode]
              properties:
                available: {const: false}
                reasonCode: {const: LANDING_BACKFILL_DEPENDENCY}
    FxRates:
      type: object
      required: [schemaVersion, dataMode, reportingCurrency, coverage, rates]
