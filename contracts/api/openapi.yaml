            - inventoryReplenishmentReplay
          properties:
            inventoryReplenishmentCurrentSnapshot:
              type: object
              required: [available]
              properties:
                available: {type: boolean}
                reasonCode: {type: [string, "null"]}
            inventoryReplenishmentReplay:
              type: object
              required: [available]
              properties:
                available: {type: boolean}
                reasonCode: {type: [string, "null"]}
    ForecastUnavailable:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - dataMode
        - versionId
        - forecastRunId
        - semanticFingerprint
        - reasonCode
        - message
        - capabilities
      properties:
        schemaVersion: {const: retail-forecast-unavailable/v1}
        dataMode: {const: unavailable}
        versionId: {type: ["string", "null"]}
        forecastRunId: {type: ["string", "null"]}
        semanticFingerprint: {type: ["string", "null"]}
        reasonCode:
          type: string
          enum:
            - FORECAST_ARTIFACT_INVALID
            - FORECAST_LINEAGE_MISMATCH
            - FORECAST_READ_MODEL_UNAVAILABLE
        message: {type: string, minLength: 1}
        capabilities:
          type: object
          additionalProperties: false
          required: [demandForecastNonPit, pointInTimeForecasting]
          properties:
            demandForecastNonPit:
              type: object
              additionalProperties: false
              required: [available, reasonCode]
              properties:
                available: {const: false}
                reasonCode: {type: string, minLength: 1}
            pointInTimeForecasting:
              type: object
              additionalProperties: false
              required: [available, reasonCode]
              properties:
                available: {const: false}
                reasonCode: {const: LANDING_BACKFILL_DEPENDENCY}
    FxRates:
      type: object
      required: [schemaVersion, dataMode, reportingCurrency, coverage, rates]
      properties:
        schemaVersion: {const: retail-fx-rates/v1}
        dataMode: {const: live}
        reportingCurrency: {type: string, minLength: 3, maxLength: 3}
        coverage:
          type: object
          required: [start, end, observations]
          properties:
            start: {type: string, format: date}
            end: {type: string, format: date}
            observations: {type: integer, minimum: 1}
        rates:
          type: array
          minItems: 1
          items:
            type: object
            required: [baseCurrency, quoteCurrency, rate, rateDate]
            properties:
              baseCurrency: {type: string, minLength: 3, maxLength: 3}
              quoteCurrency: {type: string, minLength: 3, maxLength: 3}
              rate:
                type: string
                pattern: '^[0-9]+(\.[0-9]+)?$'
              rateDate: {type: string, format: date}
    DataManagementDashboard:
      type: object
      required: [schemaVersion, dataMode, kpis, sources, footer, filters]
      properties:
        schemaVersion: {const: retail-data-management-dashboard/v1}
        dataMode: {const: live}
        kpis:
          type: object
          required:
            - dataFreshnessPct
            - qualityScorePct
            - connectedSources
            - rejectedRecords
            - lastRefreshAt
          properties:
            dataFreshnessPct: {type: number, minimum: 0, maximum: 100}
            qualityScorePct: {type: number, minimum: 0, maximum: 100}
            connectedSources: {type: integer, minimum: 0}
            rejectedRecords: {type: integer, minimum: 0}
            lastRefreshAt: {type: string, format: date-time}
        sources:
          type: array
          items:
            type: object
            required:
              - sourceSystem
              - name
              - type
              - lastRefreshAt
              - records
              - qualityPct
              - status
              - action
              - datasetCount
              - objectCount
            properties:
              sourceSystem: {type: string}
              name: {type: string}
              type: {type: string}
              lastRefreshAt: {type: string, format: date-time}
              records: {type: integer, minimum: 0}
              qualityPct: {type: number, minimum: 0, maximum: 100}
              status: {type: string, enum: [Healthy, Needs attention]}
              action: {const: View mapping}
              datasetCount: {type: integer, minimum: 0}
              objectCount: {type: integer, minimum: 0}
        footer:
          type: object
          required:
            - totalSkus
            - activeSkus
            - stores
            - channels
            - forecastCoveragePct
            - modelAccuracyPct
          properties:
            totalSkus: {type: integer, minimum: 0}
            activeSkus: {type: integer, minimum: 0}
            stores: {type: integer, minimum: 0}
            channels: {type: integer, minimum: 0}
            forecastCoveragePct: {type: [number, "null"], minimum: 0, maximum: 100}
            modelAccuracyPct: {type: [number, "null"], minimum: 0, maximum: 100}
        filters:
          type: object
          required: [dateRange, markets, stores, channelTypes, currencies]
          properties:
            dateRange:
              type: object
              required: [start, end]
              properties:
                start: {type: string, format: date}
                end: {type: string, format: date}
            markets:
              type: array
              items:
                type: object
                required: [marketId, name]
                properties:
                  marketId: {type: string}
                  name: {type: string}
            stores: {type: array, items: {type: object}}
            channelTypes:
              type: array
              items:
                type: object
                required: [type, name, marketIds]
                properties:
                  type: {type: string}
                  name: {type: string}
                  marketIds:
                    type: array
                    minItems: 1
                    items: {type: string}
            currencies: {type: array, items: {type: string}}
    DataManagementSummary:
      type: object
      required:
        - schemaVersion
        - dataMode
        - sourceSnapshotId
        - gateAStatus
        - gateBStatus
        - sourceDatasetCount
        - canonicalEntityCount
        - curatedObjectCount
        - publicationFingerprint
        - capabilityMask
      properties:
        schemaVersion: {const: retail-data-management/v1}
        dataMode: {const: live}
        sourceSnapshotId: {type: string}
        nativeSnapshotId: {type: [string, "null"]}
        gateAStatus: {type: string}
        gateBStatus: {type: string}
        sourceDatasetCount: {type: integer, minimum: 0}
        canonicalEntityCount: {type: integer, minimum: 0}
        curatedObjectCount: {type: integer, minimum: 0}
        publicationFingerprint: {type: string}
        capabilityMask: {type: object}
