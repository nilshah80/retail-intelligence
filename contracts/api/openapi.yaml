openapi: 3.1.0
info:
  title: Retail Intelligence API
  version: 0.3.1
  description: >-
    Read-only data-management and Phase 3 forecast API. Forecast routes serve
    only an explicitly activated PostgreSQL projection produced from an
    accepted, fully verified ten-artifact forecast bundle.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: health
      responses:
        "200":
          description: Process is ready.
          content:
            application/json:
              schema: {type: object}
  /api/v1/data-management/summary:
    get:
      operationId: dataManagementSummary
      responses:
        "200":
          description: Accepted landing and curated publication summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataManagementSummary"
  /api/v1/data-management/dashboard:
    get:
      operationId: dataManagementDashboard
      responses:
        "200":
          description: Original Data Management screen backed by accepted evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataManagementDashboard"
  /api/v1/data-management/gates:
    get:
      operationId: qualityGates
      responses:
        "200":
          description: Machine-readable Gate A and Gate B reports.
          content:
            application/json:
              schema: {type: object}
  /api/v1/data-management/capabilities:
    get:
      operationId: capabilityMask
      responses:
        "200":
          description: Published capability availability and reason codes.
          content:
            application/json:
              schema: {type: object}
  /api/v1/data-management/reconciliation:
    get:
      operationId: reconciliation
      responses:
        "200":
          description: Exact per-currency source-to-canonical controls.
          content:
            application/json:
              schema:
                type: array
                items: {type: object}
  /api/v1/data-management/quality-findings:
    get:
      operationId: qualityFindings
      responses:
        "200":
          description: Warnings, capability downgrades and critical findings.
          content:
            application/json:
              schema:
                type: array
                items: {type: object}
  /api/v1/fx/rates:
    get:
      operationId: fxRates
      responses:
        "200":
          description: Accepted as-of FX rates into the retailer reporting currency.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FxRates"
  /api/v1/forecast/versions:
    get:
      operationId: forecastVersions
      responses:
        "200":
          $ref: "#/components/responses/ForecastLive"
        "409":
          $ref: "#/components/responses/ForecastStale"
        "503":
          $ref: "#/components/responses/ForecastUnavailable"
  /api/v1/forecast/summary:
    get:
      operationId: forecastSummary
      responses:
        "200":
          $ref: "#/components/responses/ForecastLive"
        "409":
          $ref: "#/components/responses/ForecastStale"
        "503":
          $ref: "#/components/responses/ForecastUnavailable"
  /api/v1/forecast/series:
    get:
      operationId: forecastSeries
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastRegion"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastChannel"}
        - {$ref: "#/components/parameters/ForecastChannelType"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastHorizon"}
        - {$ref: "#/components/parameters/ForecastHorizonWeeks"}
        - {$ref: "#/components/parameters/ForecastView"}
        - {$ref: "#/components/parameters/ForecastSearch"}
        - {$ref: "#/components/parameters/ForecastOffset"}
        - {$ref: "#/components/parameters/ForecastLimit"}
      responses:
        "200":
          $ref: "#/components/responses/ForecastLive"
        "409":
          $ref: "#/components/responses/ForecastStale"
        "503":
          $ref: "#/components/responses/ForecastUnavailable"
  /api/v1/forecast/actuals:
    get:
      operationId: forecastActuals
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastRegion"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastChannel"}
        - {$ref: "#/components/parameters/ForecastChannelType"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastHorizon"}
        - {$ref: "#/components/parameters/ForecastView"}
        - {$ref: "#/components/parameters/ForecastSearch"}
        - {$ref: "#/components/parameters/ForecastOffset"}
        - {$ref: "#/components/parameters/ForecastLimit"}
      responses:
        "200":
          $ref: "#/components/responses/ForecastLive"
        "409":
          $ref: "#/components/responses/ForecastStale"
        "503":
          $ref: "#/components/responses/ForecastUnavailable"
  /api/v1/forecast/horizons:
    get:
      operationId: forecastHorizons
      description: >-
        Filter-scoped additive metrics. The server always SUMs governed
        components before dividing.
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastRegion"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastChannel"}
        - {$ref: "#/components/parameters/ForecastChannelType"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastHorizon"}
        - {$ref: "#/components/parameters/ForecastSearch"}
      responses:
        "200":
          $ref: "#/components/responses/ForecastLive"
        "409":
          $ref: "#/components/responses/ForecastStale"
        "503":
          $ref: "#/components/responses/ForecastUnavailable"
  /api/v1/forecast/stores:
    get:
      operationId: forecastStores
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastRegion"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastChannel"}
        - {$ref: "#/components/parameters/ForecastChannelType"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastHorizonWeeks"}
        - {$ref: "#/components/parameters/ForecastSearch"}
      responses:
        "200":
          $ref: "#/components/responses/ForecastLive"
        "409":
          $ref: "#/components/responses/ForecastStale"
        "503":
          $ref: "#/components/responses/ForecastUnavailable"
  /api/v1/forecast/drivers:
    get:
      operationId: forecastDrivers
      parameters:
        - name: scope
          in: query
          schema: {type: string}
          description: Exact governed driver scope; defaults to portfolio.
      responses:
        "200":
          $ref: "#/components/responses/ForecastLive"
        "409":
          $ref: "#/components/responses/ForecastStale"
        "503":
          $ref: "#/components/responses/ForecastUnavailable"
  /api/v1/forecast/signals:
    get:
      operationId: forecastSignals
      responses:
        "200":
          $ref: "#/components/responses/ForecastLive"
        "409":
          $ref: "#/components/responses/ForecastStale"
        "503":
          $ref: "#/components/responses/ForecastUnavailable"
  /api/v1/forecast/exceptions:
    get:
      operationId: forecastExceptions
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastChannel"}
        - {$ref: "#/components/parameters/ForecastSearch"}
        - name: exceptionClass
          in: query
          schema: {type: string}
        - {$ref: "#/components/parameters/ForecastOffset"}
        - {$ref: "#/components/parameters/ForecastLimit"}
      responses:
        "200":
          $ref: "#/components/responses/ForecastLive"
        "409":
          $ref: "#/components/responses/ForecastStale"
        "503":
          $ref: "#/components/responses/ForecastUnavailable"
components:
  parameters:
    ForecastMarket:
      name: marketId
      in: query
      schema: {type: string}
    ForecastRegion:
      name: region
      in: query
      schema: {type: string}
    ForecastStore:
      name: storeId
      in: query
      schema: {type: string}
    ForecastChannel:
      name: channelId
      in: query
      schema: {type: string}
    ForecastChannelType:
      name: channelType
      in: query
      schema: {type: string, enum: [online, store]}
    ForecastCategory:
      name: category
      in: query
      schema: {type: string}
    ForecastHorizon:
      name: horizon
      in: query
      schema: {type: integer, minimum: 0, maximum: 26, default: 0}
    ForecastHorizonWeeks:
      name: horizonWeeks
      in: query
      description: Inclusive future-horizon cap used by aggregated projections.
      schema: {type: integer, minimum: 1, maximum: 26, default: 4}
    ForecastView:
      name: view
      in: query
      description: Optional UI projection; unsupported values retain the raw resource.
      schema: {type: string, enum: [raw, workbench, weekly]}
    ForecastSearch:
      name: search
      in: query
      schema: {type: string, maxLength: 200}
    ForecastOffset:
      name: offset
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    ForecastLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
  responses:
    ForecastLive:
      description: >-
        Live data from the explicitly activated, lineage-matching PostgreSQL
        forecast projection.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ForecastLive"
    ForecastUnavailable:
      description: >-
        Forecast data is unavailable because no fully verified forecast read
        model can be served.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ForecastUnavailable"
    ForecastStale:
      description: >-
        An activated forecast exists, but its curated-publication lineage is
        stale or superseded and cannot be served.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ForecastUnavailable"
  schemas:
    ForecastLive:
      type: object
      required:
        - schemaVersion
        - dataMode
        - versionId
        - forecastRunId
        - semanticFingerprint
        - publicationFingerprint
        - activationScopeFingerprint
        - decisionAsOf
        - markets
        - capabilities
        - items
      properties:
        schemaVersion:
          type: string
          pattern: ^retail-forecast-[a-z-]+/v1$
        dataMode: {const: live}
        versionId:
          type: string
          pattern: ^fv_[0-9a-f]{16}$
        forecastRunId:
          type: string
          pattern: ^fr_[0-9a-f]{16}$
        semanticFingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
        publicationFingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
        activationScopeFingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
        decisionAsOf:
          type: string
          format: date-time
        markets:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string}
        capabilities:
          type: object
          additionalProperties: false
          required: [demandForecastNonPit, pointInTimeForecasting]
          properties:
            demandForecastNonPit:
              type: object
              additionalProperties: false
              required: [available]
              properties:
                available: {const: true}
            pointInTimeForecasting:
              type: object
              additionalProperties: false
              required: [available, reasonCode]
              properties:
                available: {const: false}
                reasonCode: {const: LANDING_BACKFILL_DEPENDENCY}
        items:
          type: array
          items: {type: object}
        unavailableItems:
          type: array
          items: {type: object}
        freshnessBaseline:
          type: string
          format: date-time
        pagination:
          type: object
          additionalProperties: false
          required: [offset, limit, total]
          properties:
            offset: {type: integer, minimum: 0}
            limit: {type: integer, minimum: 1, maximum: 1000}
            total: {type: integer, minimum: 0}
    ForecastUnavailable:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - dataMode
        - versionId
        - forecastRunId
        - semanticFingerprint
        - reasonCode
        - message
        - capabilities
      properties:
        schemaVersion: {const: retail-forecast-unavailable/v1}
        dataMode: {const: unavailable}
        versionId: {type: ["string", "null"]}
        forecastRunId: {type: ["string", "null"]}
        semanticFingerprint: {type: ["string", "null"]}
        reasonCode:
          type: string
          enum:
            - FORECAST_ARTIFACT_INVALID
            - FORECAST_LINEAGE_MISMATCH
            - FORECAST_READ_MODEL_UNAVAILABLE
        message: {type: string, minLength: 1}
        capabilities:
          type: object
          additionalProperties: false
          required: [demandForecastNonPit, pointInTimeForecasting]
          properties:
            demandForecastNonPit:
              type: object
              additionalProperties: false
              required: [available, reasonCode]
              properties:
                available: {const: false}
                reasonCode: {type: string, minLength: 1}
            pointInTimeForecasting:
              type: object
              additionalProperties: false
              required: [available, reasonCode]
              properties:
                available: {const: false}
                reasonCode: {const: LANDING_BACKFILL_DEPENDENCY}
    FxRates:
      type: object
      required: [schemaVersion, dataMode, reportingCurrency, coverage, rates]
      properties:
        schemaVersion: {const: retail-fx-rates/v1}
        dataMode: {const: live}
        reportingCurrency: {type: string, minLength: 3, maxLength: 3}
        coverage:
          type: object
          required: [start, end, observations]
          properties:
            start: {type: string, format: date}
            end: {type: string, format: date}
            observations: {type: integer, minimum: 1}
        rates:
          type: array
          minItems: 1
          items:
            type: object
            required: [baseCurrency, quoteCurrency, rate, rateDate]
            properties:
              baseCurrency: {type: string, minLength: 3, maxLength: 3}
              quoteCurrency: {type: string, minLength: 3, maxLength: 3}
              rate:
                type: string
                pattern: '^[0-9]+(\.[0-9]+)?$'
              rateDate: {type: string, format: date}
    DataManagementDashboard:
      type: object
      required: [schemaVersion, dataMode, kpis, sources, footer, filters]
      properties:
        schemaVersion: {const: retail-data-management-dashboard/v1}
        dataMode: {const: live}
        kpis:
          type: object
          required:
            - dataFreshnessPct
            - qualityScorePct
            - connectedSources
            - rejectedRecords
            - lastRefreshAt
          properties:
            dataFreshnessPct: {type: number, minimum: 0, maximum: 100}
            qualityScorePct: {type: number, minimum: 0, maximum: 100}
            connectedSources: {type: integer, minimum: 0}
            rejectedRecords: {type: integer, minimum: 0}
            lastRefreshAt: {type: string, format: date-time}
        sources:
          type: array
          items:
            type: object
            required:
              - sourceSystem
              - name
              - type
              - lastRefreshAt
              - records
              - qualityPct
              - status
              - action
              - datasetCount
              - objectCount
            properties:
              sourceSystem: {type: string}
              name: {type: string}
              type: {type: string}
              lastRefreshAt: {type: string, format: date-time}
              records: {type: integer, minimum: 0}
              qualityPct: {type: number, minimum: 0, maximum: 100}
              status: {type: string, enum: [Healthy, Needs attention]}
              action: {const: View mapping}
              datasetCount: {type: integer, minimum: 0}
              objectCount: {type: integer, minimum: 0}
        footer:
          type: object
          required:
            - totalSkus
            - activeSkus
            - stores
            - channels
            - forecastCoveragePct
            - modelAccuracyPct
          properties:
            totalSkus: {type: integer, minimum: 0}
            activeSkus: {type: integer, minimum: 0}
            stores: {type: integer, minimum: 0}
            channels: {type: integer, minimum: 0}
            forecastCoveragePct: {type: [number, "null"], minimum: 0, maximum: 100}
            modelAccuracyPct: {type: [number, "null"], minimum: 0, maximum: 100}
        filters:
          type: object
          required: [dateRange, markets, stores, channelTypes, currencies]
          properties:
            dateRange:
              type: object
              required: [start, end]
              properties:
                start: {type: string, format: date}
                end: {type: string, format: date}
            markets:
              type: array
              items:
                type: object
                required: [marketId, name]
                properties:
                  marketId: {type: string}
                  name: {type: string}
            stores: {type: array, items: {type: object}}
            channelTypes:
              type: array
              items:
                type: object
                required: [type, name, marketIds]
                properties:
                  type: {type: string}
                  name: {type: string}
                  marketIds:
                    type: array
                    minItems: 1
                    items: {type: string}
            currencies: {type: array, items: {type: string}}
    DataManagementSummary:
      type: object
      required:
        - schemaVersion
        - dataMode
        - sourceSnapshotId
        - gateAStatus
        - gateBStatus
        - sourceDatasetCount
        - canonicalEntityCount
        - curatedObjectCount
        - publicationFingerprint
        - capabilityMask
      properties:
        schemaVersion: {const: retail-data-management/v1}
        dataMode: {const: live}
        sourceSnapshotId: {type: string}
        nativeSnapshotId: {type: [string, "null"]}
        gateAStatus: {type: string}
        gateBStatus: {type: string}
        sourceDatasetCount: {type: integer, minimum: 0}
        canonicalEntityCount: {type: integer, minimum: 0}
        curatedObjectCount: {type: integer, minimum: 0}
        publicationFingerprint: {type: string}
        capabilityMask: {type: object}
