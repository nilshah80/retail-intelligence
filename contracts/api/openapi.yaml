openapi: 3.1.0
info:
  title: Retail Intelligence API
  version: 0.6.0
  description: >-
    Governed data-management, forecast, inventory, pricing, competitor and
    promotion-planning API. Read routes serve explicitly activated PostgreSQL
    projections; simulation POSTs are bounded and perform no database or domain
    writes.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: health
      responses:
        "200":
          description: Process is ready.
          content:
            application/json:
              schema: {type: object}
  /api/v1/data-management/summary:
    get:
      operationId: dataManagementSummary
      responses:
        "200":
          description: Accepted landing and curated publication summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataManagementSummary"
  /api/v1/data-management/dashboard:
    get:
      operationId: dataManagementDashboard
      responses:
        "200":
          description: Original Data Management screen backed by accepted evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataManagementDashboard"
  /api/v1/data-management/gates:
    get:
      operationId: qualityGates
      responses:
        "200":
          description: Machine-readable Gate A and Gate B reports.
          content:
            application/json:
              schema: {type: object}
  /api/v1/data-management/capabilities:
    get:
      operationId: capabilityMask
      responses:
        "200":
          description: Published capability availability and reason codes.
          content:
            application/json:
              schema: {type: object}
  /api/v1/data-management/reconciliation:
    get:
      operationId: reconciliation
      responses:
        "200":
          description: Exact per-currency source-to-canonical controls.
          content:
            application/json:
              schema:
                type: array
                items: {type: object}
  /api/v1/data-management/quality-findings:
    get:
      operationId: qualityFindings
      responses:
        "200":
          description: Warnings, capability downgrades and critical findings.
          content:
            application/json:
              schema:
                type: array
                items: {type: object}
  /api/v1/fx/rates:
    get:
      operationId: fxRates
      responses:
        "200":
          description: Accepted as-of FX rates into the retailer reporting currency.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FxRates"
  /api/v1/forecast/versions:
    get:
      operationId: forecastVersions
      responses:
        "200":
          $ref: "#/components/responses/ForecastLive"
        "409":
          $ref: "#/components/responses/ForecastStale"
        "503":
          $ref: "#/components/responses/ForecastUnavailable"
  /api/v1/forecast/summary:
    get:
      operationId: forecastSummary
      responses:
        "200":
          $ref: "#/components/responses/ForecastLive"
        "409":
          $ref: "#/components/responses/ForecastStale"
        "503":
          $ref: "#/components/responses/ForecastUnavailable"
  /api/v1/forecast/series:
    get:
      operationId: forecastSeries
      description: >-
        Returns the per-horizon series rows by default, or the aggregated SKU
        workbench row when `view=workbench`. Workbench items additionally satisfy
        `#/components/schemas/ForecastWorkbenchIntervalScope`, which frozen
        decision #64 Q19 requires every interval-bearing aggregate to carry.
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastRegion"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastChannel"}
        - {$ref: "#/components/parameters/ForecastChannelType"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastHorizon"}
        - {$ref: "#/components/parameters/ForecastHorizonWeeks"}
        - {$ref: "#/components/parameters/ForecastView"}
        - {$ref: "#/components/parameters/ForecastSearch"}
        - {$ref: "#/components/parameters/ForecastOffset"}
        - {$ref: "#/components/parameters/ForecastLimit"}
      responses:
        "200":
          $ref: "#/components/responses/ForecastLive"
        "409":
          $ref: "#/components/responses/ForecastStale"
        "503":
          $ref: "#/components/responses/ForecastUnavailable"
  /api/v1/forecast/actuals:
    get:
      operationId: forecastActuals
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastRegion"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastChannel"}
        - {$ref: "#/components/parameters/ForecastChannelType"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastHorizon"}
        - {$ref: "#/components/parameters/ForecastView"}
        - {$ref: "#/components/parameters/ForecastSearch"}
        - {$ref: "#/components/parameters/ForecastOffset"}
        - {$ref: "#/components/parameters/ForecastLimit"}
      responses:
        "200":
          $ref: "#/components/responses/ForecastLive"
        "409":
          $ref: "#/components/responses/ForecastStale"
        "503":
          $ref: "#/components/responses/ForecastUnavailable"
  /api/v1/forecast/horizons:
    get:
      operationId: forecastHorizons
      description: >-
        Filter-scoped additive metrics. The server always SUMs governed
        components before dividing.
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastRegion"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastChannel"}
        - {$ref: "#/components/parameters/ForecastChannelType"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastHorizon"}
        - {$ref: "#/components/parameters/ForecastSearch"}
      responses:
        "200":
          $ref: "#/components/responses/ForecastLive"
        "409":
          $ref: "#/components/responses/ForecastStale"
        "503":
          $ref: "#/components/responses/ForecastUnavailable"
  /api/v1/forecast/stores:
    get:
      operationId: forecastStores
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastRegion"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastChannel"}
        - {$ref: "#/components/parameters/ForecastChannelType"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastHorizonWeeks"}
        - {$ref: "#/components/parameters/ForecastSearch"}
      responses:
        "200":
          $ref: "#/components/responses/ForecastLive"
        "409":
          $ref: "#/components/responses/ForecastStale"
        "503":
          $ref: "#/components/responses/ForecastUnavailable"
  /api/v1/forecast/drivers:
    get:
      operationId: forecastDrivers
      parameters:
        - name: scope
          in: query
          schema: {type: string}
          description: Exact governed driver scope; defaults to portfolio.
      responses:
        "200":
          $ref: "#/components/responses/ForecastLive"
        "409":
          $ref: "#/components/responses/ForecastStale"
        "503":
          $ref: "#/components/responses/ForecastUnavailable"
  /api/v1/forecast/signals:
    get:
      operationId: forecastSignals
      responses:
        "200":
          $ref: "#/components/responses/ForecastLive"
        "409":
          $ref: "#/components/responses/ForecastStale"
        "503":
          $ref: "#/components/responses/ForecastUnavailable"
  /api/v1/forecast/exceptions:
    get:
      operationId: forecastExceptions
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastChannel"}
        - {$ref: "#/components/parameters/ForecastSearch"}
        - name: exceptionClass
          in: query
          schema: {type: string}
        - {$ref: "#/components/parameters/ForecastOffset"}
        - {$ref: "#/components/parameters/ForecastLimit"}
      responses:
        "200":
          $ref: "#/components/responses/ForecastLive"
        "409":
          $ref: "#/components/responses/ForecastStale"
        "503":
          $ref: "#/components/responses/ForecastUnavailable"
  /api/v1/forecast/scenario:
    post:
      operationId: runForecastScenario
      description: >-
        Calculates one stateless, assumption-based forecast projection against
        an exact authority tuple obtained from the bootstrap endpoint. This is
        not fitted elasticity, causal lift, or an executable inventory order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioRunRequest"
      responses:
        "200":
          $ref: "#/components/responses/ScenarioRunLive"
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "409":
          $ref: "#/components/responses/ScenarioStale"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/ScenarioValidationInvalid"
        "503":
          $ref: "#/components/responses/ScenarioUnavailable"
  /api/v1/forecast/scenario/context:
    get:
      operationId: forecastScenarioContext
      description: >-
        Resolves the one active assumption-projection authority tuple for the
        server-configured retailer, tenant, capability and environment. The query
        pins the forecast version already rendered by the Forecast screen; a
        mismatch is stale rather than a silently retargeted scenario.
      parameters:
        - name: expectedForecastVersion
          in: query
          required: true
          schema:
            type: string
            pattern: ^fv_[0-9a-f]{16}$
      responses:
        "200":
          $ref: "#/components/responses/ScenarioContextLive"
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "409":
          $ref: "#/components/responses/ScenarioStale"
        "503":
          $ref: "#/components/responses/ScenarioUnavailable"
  /api/v1/inventory/versions:
    get:
      operationId: inventoryVersions
      description: >-
        Active inventory/replenishment version, lineage and capability state. Serves only the explicitly activated, lineage-matching
        PostgreSQL projection of one accepted inventory/replenishment run;
        fails closed otherwise.
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastSearch"}
        - {$ref: "#/components/parameters/ForecastOffset"}
        - {$ref: "#/components/parameters/ForecastLimit"}
      responses:
        "200":
          $ref: "#/components/responses/InventoryLive"
        "409":
          $ref: "#/components/responses/InventoryStale"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"
  /api/v1/inventory/overview:
    get:
      operationId: inventoryOverview
      description: >-
        Market/location position, health, risk and replay summary. Serves only the explicitly activated, lineage-matching
        PostgreSQL projection of one accepted inventory/replenishment run;
        fails closed otherwise.
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastSearch"}
        - {$ref: "#/components/parameters/ForecastOffset"}
        - {$ref: "#/components/parameters/ForecastLimit"}
      responses:
        "200":
          $ref: "#/components/responses/InventoryLive"
        "409":
          $ref: "#/components/responses/InventoryStale"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"
  /api/v1/inventory/stores:
    get:
      operationId: inventoryStores
      description: >-
        Store-grain position, availability, days of supply and risk. Serves only the explicitly activated, lineage-matching
        PostgreSQL projection of one accepted inventory/replenishment run;
        fails closed otherwise.
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastSearch"}
        - {$ref: "#/components/parameters/ForecastOffset"}
        - {$ref: "#/components/parameters/ForecastLimit"}
      responses:
        "200":
          $ref: "#/components/responses/InventoryLive"
        "409":
          $ref: "#/components/responses/InventoryStale"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"
  /api/v1/inventory/warehouses:
    get:
      operationId: inventoryWarehouses
      description: >-
        DC position, valuation, utilization and receipt state. Serves only the explicitly activated, lineage-matching
        PostgreSQL projection of one accepted inventory/replenishment run;
        fails closed otherwise.
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastSearch"}
        - {$ref: "#/components/parameters/ForecastOffset"}
        - {$ref: "#/components/parameters/ForecastLimit"}
      responses:
        "200":
          $ref: "#/components/responses/InventoryLive"
        "409":
          $ref: "#/components/responses/InventoryStale"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"
  /api/v1/inventory/ageing:
    get:
      operationId: inventoryAgeing
      description: >-
        Age buckets and the deterministic action ladder, including de-assorted residual stock. Serves only the explicitly activated, lineage-matching
        PostgreSQL projection of one accepted inventory/replenishment run;
        fails closed otherwise.
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastSearch"}
        - {$ref: "#/components/parameters/ForecastOffset"}
        - {$ref: "#/components/parameters/ForecastLimit"}
      responses:
        "200":
          $ref: "#/components/responses/InventoryLive"
        "409":
          $ref: "#/components/responses/InventoryStale"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"
  /api/v1/inventory/transfers:
    get:
      operationId: inventoryTransfers
      description: >-
        Current transfer recommendations over typed lanes. Serves only the explicitly activated, lineage-matching
        PostgreSQL projection of one accepted inventory/replenishment run;
        fails closed otherwise.
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastSearch"}
        - {$ref: "#/components/parameters/ForecastOffset"}
        - {$ref: "#/components/parameters/ForecastLimit"}
      responses:
        "200":
          $ref: "#/components/responses/InventoryLive"
        "409":
          $ref: "#/components/responses/InventoryStale"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"
  /api/v1/inventory/valuation:
    get:
      operationId: inventoryValuation
      description: >-
        Gross valuation and DC-only ERP-vs-WMS variance; NRV and provisions are unavailable per P4-D10. Serves only the explicitly activated, lineage-matching
        PostgreSQL projection of one accepted inventory/replenishment run;
        fails closed otherwise.
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastSearch"}
        - {$ref: "#/components/parameters/ForecastOffset"}
        - {$ref: "#/components/parameters/ForecastLimit"}
      responses:
        "200":
          $ref: "#/components/responses/InventoryLive"
        "409":
          $ref: "#/components/responses/InventoryStale"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"
  /api/v1/inventory/expiry-waste:
    get:
      operationId: inventoryExpiryWaste
      description: >-
        Expiry-window exposure and waste actuals for shelf-life-bearing SKUs. Serves only the explicitly activated, lineage-matching
        PostgreSQL projection of one accepted inventory/replenishment run;
        fails closed otherwise.
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastSearch"}
        - {$ref: "#/components/parameters/ForecastOffset"}
        - {$ref: "#/components/parameters/ForecastLimit"}
      responses:
        "200":
          $ref: "#/components/responses/InventoryLive"
        "409":
          $ref: "#/components/responses/InventoryStale"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"
  /api/v1/inventory/stock-health:
    get:
      operationId: inventoryStockHealth
      description: >-
        Eight-column SKU x store triage table. Serves only the explicitly activated, lineage-matching
        PostgreSQL projection of one accepted inventory/replenishment run;
        fails closed otherwise.
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastSearch"}
        - {$ref: "#/components/parameters/ForecastOffset"}
        - {$ref: "#/components/parameters/ForecastLimit"}
      responses:
        "200":
          $ref: "#/components/responses/InventoryLive"
        "409":
          $ref: "#/components/responses/InventoryStale"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"
  /api/v1/replenishment/planner:
    get:
      operationId: replenishmentPlanner
      description: >-
        Replenishment planner rows with lane, term, capacity and budget guards. Serves only the explicitly activated, lineage-matching
        PostgreSQL projection of one accepted inventory/replenishment run;
        fails closed otherwise.
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastSearch"}
        - {$ref: "#/components/parameters/ForecastOffset"}
        - {$ref: "#/components/parameters/ForecastLimit"}
      responses:
        "200":
          $ref: "#/components/responses/InventoryLive"
        "409":
          $ref: "#/components/responses/InventoryStale"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"
  /api/v1/replenishment/orders:
    get:
      operationId: replenishmentOrders
      description: >-
        Read-only suggested orders; ERP status is shadow_not_sent. Serves only the explicitly activated, lineage-matching
        PostgreSQL projection of one accepted inventory/replenishment run;
        fails closed otherwise.
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastSearch"}
        - {$ref: "#/components/parameters/ForecastOffset"}
        - {$ref: "#/components/parameters/ForecastLimit"}
      responses:
        "200":
          $ref: "#/components/responses/InventoryLive"
        "409":
          $ref: "#/components/responses/InventoryStale"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"
  /api/v1/replenishment/suppliers:
    get:
      operationId: replenishmentSuppliers
      description: >-
        Supplier performance, capacity confirmation and risk. Serves only the explicitly activated, lineage-matching
        PostgreSQL projection of one accepted inventory/replenishment run;
        fails closed otherwise.
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastSearch"}
        - {$ref: "#/components/parameters/ForecastOffset"}
        - {$ref: "#/components/parameters/ForecastLimit"}
      responses:
        "200":
          $ref: "#/components/responses/InventoryLive"
        "409":
          $ref: "#/components/responses/InventoryStale"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"
  /api/v1/replenishment/safety-stock:
    get:
      operationId: replenishmentSafetyStock
      description: >-
        Safety-stock segments from the hard-gated interval; a withheld interval row is skipped with its governed exception, never zero. Serves only the explicitly activated, lineage-matching
        PostgreSQL projection of one accepted inventory/replenishment run;
        fails closed otherwise.
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastSearch"}
        - {$ref: "#/components/parameters/ForecastOffset"}
        - {$ref: "#/components/parameters/ForecastLimit"}
      responses:
        "200":
          $ref: "#/components/responses/InventoryLive"
        "409":
          $ref: "#/components/responses/InventoryStale"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"
  /api/v1/replenishment/allocations:
    get:
      operationId: replenishmentAllocations
      description: >-
        Constrained channel allocation over one node ATP pool. Serves only the explicitly activated, lineage-matching
        PostgreSQL projection of one accepted inventory/replenishment run;
        fails closed otherwise.
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastSearch"}
        - {$ref: "#/components/parameters/ForecastOffset"}
        - {$ref: "#/components/parameters/ForecastLimit"}
      responses:
        "200":
          $ref: "#/components/responses/InventoryLive"
        "409":
          $ref: "#/components/responses/InventoryStale"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"
  /api/v1/replenishment/exceptions:
    get:
      operationId: replenishmentExceptions
      description: >-
        Deterministic engine-derived exceptions; workflow fields are unavailable. Serves only the explicitly activated, lineage-matching
        PostgreSQL projection of one accepted inventory/replenishment run;
        fails closed otherwise.
      parameters:
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastSearch"}
        - {$ref: "#/components/parameters/ForecastOffset"}
        - {$ref: "#/components/parameters/ForecastLimit"}
      responses:
        "200":
          $ref: "#/components/responses/InventoryLive"
        "409":
          $ref: "#/components/responses/InventoryStale"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"
  /api/v1/pricing/recommendations/summary:
    get:
      operationId: pricingRecommendationSummary
      description: Filter-consistent recommendation KPIs and page metadata from the active pricing bundle.
      parameters: &pricingFilters
        - {$ref: "#/components/parameters/PricingStore"}
        - {$ref: "#/components/parameters/PricingChannel"}
        - {$ref: "#/components/parameters/PricingChannelType"}
        - {$ref: "#/components/parameters/PricingCategory"}
        - {$ref: "#/components/parameters/PricingAction"}
        - {$ref: "#/components/parameters/PricingConfidence"}
        - {$ref: "#/components/parameters/PricingSearch"}
      responses: &pricingReadResponses
        "200": {$ref: "#/components/responses/PricingLive"}
        "409": {$ref: "#/components/responses/PricingStale"}
        "503": {$ref: "#/components/responses/PricingUnavailable"}
  /api/v1/pricing/recommendations:
    get:
      operationId: pricingRecommendations
      description: Bounded recommendation and withheld-assessment workbench rows.
      parameters:
        - {$ref: "#/components/parameters/PricingStore"}
        - {$ref: "#/components/parameters/PricingChannel"}
        - {$ref: "#/components/parameters/PricingChannelType"}
        - {$ref: "#/components/parameters/PricingCategory"}
        - {$ref: "#/components/parameters/PricingAction"}
        - {$ref: "#/components/parameters/PricingConfidence"}
        - {$ref: "#/components/parameters/PricingSearch"}
        - {$ref: "#/components/parameters/PricingRecordKind"}
        - {$ref: "#/components/parameters/PricingSort"}
        - {$ref: "#/components/parameters/PricingOffset"}
        - {$ref: "#/components/parameters/PricingLimit"}
      responses: *pricingReadResponses
  /api/v1/pricing/recommendations/{id}:
    get:
      operationId: pricingRecommendationDetail
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, pattern: '^pr_[0-9a-f]{20}$'}}
      responses:
        "200": {$ref: "#/components/responses/PricingLive"}
        "404": {$ref: "#/components/responses/PricingUnavailable"}
        "409": {$ref: "#/components/responses/PricingStale"}
        "503": {$ref: "#/components/responses/PricingUnavailable"}
  /api/v1/pricing/recommendations/store-view:
    get:
      operationId: pricingRecommendationStoreView
      parameters: *pricingFilters
      responses: *pricingReadResponses
  /api/v1/pricing/recommendations/category-view:
    get:
      operationId: pricingRecommendationCategoryView
      parameters: *pricingFilters
      responses: *pricingReadResponses
  /api/v1/pricing/recommendations/governance:
    get:
      operationId: pricingRecommendationGovernance
      parameters: *pricingFilters
      responses: *pricingReadResponses
  /api/v1/pricing/simulations:run:
    post:
      operationId: runPriceSimulation
      description: Bounded deterministic calculation over already materialized response, candidate, forecast and inventory evidence. It writes no state.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PriceSimulationRequest"}
      responses:
        "200":
          description: Stateless price scenario result.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceSimulationResponse"}
        "400": {$ref: "#/components/responses/RequestInvalid"}
        "409": {$ref: "#/components/responses/PricingStale"}
        "413": {$ref: "#/components/responses/RequestTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/PricingValidationInvalid"}
        "503": {$ref: "#/components/responses/PricingUnavailable"}
  /api/v1/pricing/export:
    get:
      operationId: exportPriceRecommendations
      description: Server-authored bounded CSV over recommendation rows only; it writes no state and never truncates.
      parameters:
        - {$ref: "#/components/parameters/PricingStore"}
        - {$ref: "#/components/parameters/PricingChannel"}
        - {$ref: "#/components/parameters/PricingChannelType"}
        - {$ref: "#/components/parameters/PricingCategory"}
        - {$ref: "#/components/parameters/PricingAction"}
        - {$ref: "#/components/parameters/PricingConfidence"}
        - {$ref: "#/components/parameters/PricingSearch"}
        - {$ref: "#/components/parameters/PricingSort"}
        - {name: scope, in: query, required: true, schema: {type: string, enum: [selected, filtered, all]}}
        - {name: format, in: query, required: true, schema: {type: string, enum: [csv, excel_csv]}}
        - {name: includeExplanation, in: query, required: true, schema: {type: string, enum: [yes, no]}}
        - {name: filename, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 80}}
        - {name: expectedCount, in: query, required: true, schema: {type: integer, minimum: 0, maximum: 10000}}
        - {name: expectedActivationSetId, in: query, required: true, schema: {type: string, pattern: '^pact_[0-9a-f]{16}$'}}
        - {name: ids, in: query, required: false, description: Comma-separated unique recommendation IDs; required only for selected scope., schema: {type: string}}
      responses:
        "200":
          description: Exact server-counted recommendation export.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            Content-Disposition: {schema: {type: string, pattern: '^attachment; filename="[A-Za-z0-9_.-]+\.csv"$'}}
            X-Export-Count: {schema: {type: integer, minimum: 1, maximum: 10000}}
            X-Export-ID: {schema: {type: string, pattern: '^pex_[0-9a-f]{16}$'}}
            X-Scope-Revision: {schema: {type: string, pattern: '^pact_[0-9a-f]{16}$'}}
          content:
            text/csv:
              schema: {type: string, format: binary}
        "409": {$ref: "#/components/responses/PricingStale"}
        "422": {$ref: "#/components/responses/PricingValidationInvalid"}
        "503": {$ref: "#/components/responses/PricingUnavailable"}
  /api/v1/direct-exports/{exportId}:
    get:
      operationId: exportRegisteredReadModel
      description: >-
        Server-authored bounded CSV for a closed Forecast, Inventory, or
        Replenishment trigger. The metadata mode returns the opaque scope
        revision and limit needed before an attachment request. Neither mode
        writes state and the attachment is never silently truncated.
      parameters:
        - {name: exportId, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 64}}
        - {name: metadata, in: query, required: false, schema: {type: boolean, default: false}}
        - {name: scope, in: query, required: true, schema: {type: string, enum: [selected_visible, current_filtered]}}
        - {name: expectedCount, in: query, required: true, schema: {type: integer, minimum: 0, maximum: 1000}}
        - {name: scopeRevision, in: query, required: false, schema: {type: string, pattern: '^scope_[0-9a-f]{20}$'}}
        - {name: ids, in: query, required: false, description: Comma-separated unique visible row IDs., schema: {type: string}}
        - {$ref: "#/components/parameters/ForecastMarket"}
        - {$ref: "#/components/parameters/ForecastRegion"}
        - {$ref: "#/components/parameters/ForecastStore"}
        - {$ref: "#/components/parameters/ForecastChannel"}
        - {$ref: "#/components/parameters/ForecastChannelType"}
        - {$ref: "#/components/parameters/ForecastCategory"}
        - {$ref: "#/components/parameters/ForecastHorizonWeeks"}
        - {$ref: "#/components/parameters/ForecastSearch"}
        - {name: currency, in: query, required: true, schema: {type: string, pattern: '^(?:[A-Z]{3}|MULTI)$'}}
      responses:
        "200":
          description: Export metadata or the exact server-counted CSV attachment.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            Content-Disposition: {schema: {type: string, pattern: '^attachment; filename="[a-z0-9-]+-[0-9a-f]{12}-[0-9]{8}T[0-9]{6}Z\.csv"$'}}
            X-Export-Count: {schema: {type: integer, minimum: 1, maximum: 1000}}
            X-Export-ID: {schema: {type: string, pattern: '^dx_[0-9a-f]{20}$'}}
            X-Scope-Revision: {schema: {type: string, pattern: '^scope_[0-9a-f]{20}$'}}
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, exportId, limit, scopeRevision, registered]
                properties:
                  schemaVersion: {const: retail-direct-export-metadata/v1}
                  exportId: {type: string}
                  limit: {type: integer, const: 1000}
                  scopeRevision: {type: string, pattern: '^scope_[0-9a-f]{20}$'}
                  registered: {type: array, items: {type: string}, uniqueItems: true}
            text/csv:
              schema: {type: string, format: binary}
        "404": {$ref: "#/components/responses/PricingUnavailable"}
        "409": {$ref: "#/components/responses/PricingStale"}
        "422": {$ref: "#/components/responses/PricingValidationInvalid"}
        "503": {$ref: "#/components/responses/PricingUnavailable"}
  /api/v1/competitors/summary:
    get:
      operationId: competitorSummary
      parameters:
        - {$ref: "#/components/parameters/PricingStore"}
        - {$ref: "#/components/parameters/PricingChannel"}
        - {$ref: "#/components/parameters/PricingChannelType"}
        - {$ref: "#/components/parameters/CompetitorMatchStatus"}
        - {$ref: "#/components/parameters/CompetitorID"}
        - {$ref: "#/components/parameters/CompetitorFreshness"}
        - {$ref: "#/components/parameters/PricingSearch"}
      responses: *pricingReadResponses
  /api/v1/competitors/matches:
    get:
      operationId: competitorMatches
      parameters:
        - {$ref: "#/components/parameters/PricingStore"}
        - {$ref: "#/components/parameters/PricingChannel"}
        - {$ref: "#/components/parameters/PricingChannelType"}
        - {$ref: "#/components/parameters/CompetitorMatchStatus"}
        - {$ref: "#/components/parameters/CompetitorID"}
        - {$ref: "#/components/parameters/CompetitorFreshness"}
        - {$ref: "#/components/parameters/PricingSearch"}
        - {$ref: "#/components/parameters/PricingOffset"}
        - {$ref: "#/components/parameters/PricingLimit"}
      responses: *pricingReadResponses
  /api/v1/competitors/matches/{id}:
    get:
      operationId: competitorMatchDetail
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/PricingStore"}
        - {$ref: "#/components/parameters/PricingChannel"}
        - {$ref: "#/components/parameters/PricingChannelType"}
      responses:
        "200": {$ref: "#/components/responses/PricingLive"}
        "404": {$ref: "#/components/responses/PricingUnavailable"}
        "409": {$ref: "#/components/responses/PricingStale"}
        "503": {$ref: "#/components/responses/PricingUnavailable"}
  /api/v1/competitors/alert-rules:
    get:
      operationId: competitorAlertRules
      description: Governed availability of persisted competitor alert rules; currently explicit unavailable rather than sample rules.
      responses: *pricingReadResponses
  /api/v1/promotions/summary:
    get: &promotionRead
      operationId: promotionSummary
      responses: *pricingReadResponses
  /api/v1/promotions/opportunities:
    get:
      <<: *promotionRead
      operationId: promotionOpportunities
  /api/v1/promotions/portfolio:
    get:
      <<: *promotionRead
      operationId: promotionPortfolio
  /api/v1/promotions/calendar:
    get:
      <<: *promotionRead
      operationId: promotionCalendar
  /api/v1/promotions/simulations:run:
    post:
      operationId: runPromotionSimulation
      description: Returns the governed negative Planner disposition and performs no calculation or write.
      responses:
        "422": {$ref: "#/components/responses/PricingValidationInvalid"}
components:
  parameters:
    ForecastMarket:
      name: marketId
      in: query
      schema: {type: string}
    ForecastRegion:
      name: region
      in: query
      schema: {type: string}
    ForecastStore:
      name: storeId
      in: query
      schema: {type: string}
    ForecastChannel:
      name: channelId
      in: query
      schema: {type: string}
    ForecastChannelType:
      name: channelType
      in: query
      schema: {type: string, enum: [online, store, marketplace]}
    ForecastCategory:
      name: category
      in: query
      schema: {type: string}
    ForecastHorizon:
      name: horizon
      in: query
      schema: {type: integer, minimum: 0, maximum: 26, default: 0}
    ForecastHorizonWeeks:
      name: horizonWeeks
      in: query
      description: Inclusive future-horizon cap used by aggregated projections.
      schema: {type: integer, minimum: 1, maximum: 26, default: 4}
    ForecastView:
      name: view
      in: query
      description: Optional UI projection; unsupported values retain the raw resource.
      schema: {type: string, enum: [raw, workbench, weekly]}
    ForecastSearch:
      name: search
      in: query
      schema: {type: string, maxLength: 200}
    ForecastOffset:
      name: offset
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    ForecastLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
    PricingStore:
      name: storeId
      in: query
      schema: {type: string}
    PricingChannel:
      name: channelId
      in: query
      schema: {type: string}
    PricingChannelType:
      name: channelType
      in: query
      description: Shared-shell channel-type filter; channel-distinct rows remain separate.
      schema: {type: string, enum: [store, online, marketplace]}
    PricingCategory:
      name: category
      in: query
      schema: {type: string}
    PricingAction:
      name: action
      in: query
      schema: {type: string, enum: [Increase, Decrease, Hold]}
    PricingConfidence:
      name: confidence
      in: query
      schema: {type: string, enum: ["90", "80", low]}
    PricingRecordKind:
      name: recordKind
      in: query
      schema: {type: string, enum: [recommendation, withheld_assessment]}
    PricingSearch:
      name: search
      in: query
      schema: {type: string, maxLength: 200}
    PricingSort:
      name: sort
      in: query
      schema: {type: string, enum: [priority, confidence_asc, revenue_desc, price_change_desc], default: priority}
    PricingOffset:
      name: offset
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    PricingLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    CompetitorMatchStatus:
      name: matchStatus
      in: query
      schema: {type: string, enum: [Matched, Needs Review, Rejected, No Match]}
    CompetitorID:
      name: competitorId
      in: query
      schema: {type: string}
    CompetitorFreshness:
      name: freshness
      in: query
      schema: {type: string, enum: [Fresh, Near threshold, Stale]}
  responses:
    ScenarioRunLive:
      description: A tuple-pinned, stateless assumption projection.
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ScenarioRunResponse"
    ScenarioValidationInvalid:
      description: The request is structurally complete but semantically invalid.
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ScenarioValidationError"
    UnsupportedMediaType:
      description: The scenario request is not application/json.
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RequestError"
    RequestTooLarge:
      description: The request body exceeds the bounded limit declared by its route.
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RequestError"
    ScenarioContextLive:
      description: One compatible, version-pinned scenario authority tuple.
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ScenarioContextBootstrap"
    ScenarioStale:
      description: The client-pinned authority is no longer current.
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ScenarioStale"
    ScenarioUnavailable:
      description: The current base or inventory-extension authority is absent or ambiguous.
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ScenarioUnavailable"
    RequestInvalid:
      description: A required query parameter is absent or malformed.
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RequestError"
    ForecastLive:
      description: >-
        Live data from the explicitly activated, lineage-matching PostgreSQL
        forecast projection.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ForecastLive"
    ForecastUnavailable:
      description: >-
        Forecast data is unavailable because no fully verified forecast read
        model can be served.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ForecastUnavailable"
    InventoryLive:
      description: >-
        Live data from the explicitly activated, lineage-matching PostgreSQL
        inventory/replenishment projection.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InventoryLive"
    InventoryUnavailable:
      description: >-
        Inventory data is unavailable because no fully verified
        inventory/replenishment read model can be served.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InventoryUnavailable"
    InventoryStale:
      description: >-
        An activated inventory version exists, but its lineage is stale or
        superseded and cannot be served.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InventoryUnavailable"
    ForecastStale:
      description: >-
        An activated forecast exists, but its curated-publication lineage is
        stale or superseded and cannot be served.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ForecastUnavailable"
    PricingLive:
      description: Live data from the explicitly activated, lineage-matching PostgreSQL pricing projection.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/PricingPage"}
    PricingUnavailable:
      description: Pricing data is unavailable because no fully verified active pricing projection can be served.
      headers:
        Cache-Control: {schema: {type: string, const: no-store}}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/PricingUnavailable"}
    PricingStale:
      description: The client/startup-pinned pricing activation no longer matches the active authority.
      headers:
        Cache-Control: {schema: {type: string, const: no-store}}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/PricingUnavailable"}
    PricingValidationInvalid:
      description: The stateless calculation request is unsupported or lacks required evidence.
      headers:
        Cache-Control: {schema: {type: string, const: no-store}}
      content:
        application/json:
          schema:
            oneOf:
              - {$ref: "#/components/schemas/PricingValidationError"}
              - {$ref: "#/components/schemas/PricingUnavailable"}
  schemas:
    PricingAuthority:
      type: object
      required: [retailerId, tenantId, environment, activationSetId, bundleId, bundleSemanticFingerprint, sourcePublicationFingerprint, sourceRunId, inputAuthorityId, sourceAsOf, selectionIds, priceMargin, priceMarginActive]
      properties:
        retailerId: {type: string}
        tenantId: {type: string}
        environment: {type: string}
        activationSetId: {type: string, pattern: '^pact_[0-9a-f]{16}$'}
        bundleId: {type: string, pattern: '^pb_[0-9a-f]{20}$'}
        bundleSemanticFingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
        sourcePublicationFingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
        sourceRunId: {type: string}
        inputAuthorityId: {type: string}
        sourceAsOf: {type: string, format: date-time}
        selectionIds: {type: array, minItems: 1, items: {type: string}}
        priceMargin:
          type: object
          required: [available, minMarginPct]
          description: >-
            Margin-capability governance carried from the active bundle. minMarginPct is the
            configured minimum-margin floor. This is a PoC with no retailer integration, so the
            generated weighted-average cost is the authoritative unit cost: available is true and
            margin is served on every surface; reasonCode is populated only if no cost basis exists
            at all. (The client-actual cost gate is a production-only concern and does not apply
            here — see the PoC Data Principle in the implementation plan.) Recommendation rows carry
            currentMarginPct / expectedMarginPct (numeric) through the open PricingPage.
          properties:
            available: {type: boolean}
            reasonCode: {type: string, nullable: true}
            minMarginPct: {type: string}
          additionalProperties: true
        priceMarginActive:
          type: boolean
          description: >-
            Whether margin is served as the governing authority. In this PoC it follows the accepted
            cost basis (priceMargin.available) since the generated weighted-average cost is the actual
            cost; it gates the Margin Protection simulation objective and the minimum-margin floor.
            (In a future real-data deployment it would instead require an active price_margin selection
            on a client cost — production-only, not applicable to this PoC.)
    PricingPage:
      type: object
      required: [schemaVersion, dataMode, authority]
      properties:
        schemaVersion: {const: retail-pricing-page/v1}
        dataMode: {const: live}
        authority: {$ref: "#/components/schemas/PricingAuthority"}
      additionalProperties: true
    PricingUnavailable:
      type: object
      required: [schemaVersion, dataMode, reasonCode, message]
      properties:
        schemaVersion: {const: retail-pricing-unavailable/v1}
        dataMode: {const: unavailable}
        reasonCode: {type: string}
        message: {type: string}
    PricingValidationError:
      type: object
      required: [schemaVersion, reasonCode, message]
      properties:
        schemaVersion:
          type: string
          enum: [retail-price-simulation-validation/v1, retail-request-error/v1]
        reasonCode: {type: string}
        message: {type: string}
    PriceSimulationRequest:
      type: object
      additionalProperties: false
      required: [recommendationId, proposedPriceMinor, simulationPeriod, demandAssumption, inventoryObjective, expectedActivationSetId]
      properties:
        recommendationId: {type: string, pattern: '^pr_[0-9a-f]{20}$'}
        proposedPriceMinor: {type: integer, minimum: 1}
        simulationPeriod: {const: Next 4 Weeks}
        demandAssumption: {type: string, enum: [Expected, Best Case, Worst Case]}
        inventoryObjective: {type: string, enum: [Margin Protection, Clearance]}
        expectedActivationSetId: {type: string, pattern: '^pact_[0-9a-f]{16}$'}
    PriceSimulationResponse:
      type: object
      required: [schemaVersion, scope, currencyCode, simulationPeriod, demandAssumption, demandScenarioSemantics, inventoryObjective, columns, metricOrder, recommendation, competitorEvidence, mutated]
      properties:
        schemaVersion: {const: retail-price-simulation/v1}
        demandScenarioSemantics: {const: additive_expected_and_sum_of_weekly_planning_bounds_not_four_week_quantiles}
        mutated: {const: false}
      additionalProperties: true
    ScenarioUserOverrides:
      type: object
      additionalProperties: false
      properties:
        demandAdjustmentPct: {type: number}
        priceChangePct: {type: number}
        promotionUpliftPct: {type: number}
        competitorAvailability:
          type: string
          enum: [normal, stockout, promotion]
        weatherEvent:
          type: string
          enum: [normal, positive, negative]
    ScenarioBusinessScope:
      type: object
      additionalProperties: false
      required: [marketId, storeId, channelId, category, horizonWeeks]
      properties:
        marketId: {type: string}
        storeId: {type: string}
        channelId: {type: string}
        channelType:
          type: string
          enum: [online, store, marketplace]
        category: {type: string}
        horizonWeeks: {type: integer, minimum: 1, maximum: 26}
    ScenarioRunRequest:
      type: object
      additionalProperties: false
      required: [presetId, userOverrides, businessScope, expectedAuthority]
      properties:
        presetId: {type: string, minLength: 1}
        userOverrides: {$ref: "#/components/schemas/ScenarioUserOverrides"}
        businessScope: {$ref: "#/components/schemas/ScenarioBusinessScope"}
        expectedAuthority: {$ref: "#/components/schemas/ScenarioAuthorityTuple"}
    ScenarioSeriesKey:
      type: object
      additionalProperties: false
      required: [marketId, skuId, storeId, channelId]
      properties:
        marketId: {type: string, minLength: 1}
        skuId: {type: string, minLength: 1}
        storeId: {type: string, minLength: 1}
        channelId: {type: string, minLength: 1}
    ScenarioCoverage:
      type: object
      additionalProperties: false
      required: [numerator, denominator, grain, pct]
      properties:
        numerator: {type: integer, minimum: 0}
        denominator: {type: integer, minimum: 0}
        grain: {type: string, minLength: 1}
        pct: {type: [number, "null"], minimum: 0, maximum: 100}
    ScenarioFloatComponent:
      type: object
      additionalProperties: false
      required: [availability, value, reasonCodes]
      properties:
        availability:
          type: string
          enum: [available, partial, unavailable]
        value: {type: [number, "null"]}
        reasonCodes:
          type: array
          items: {type: string}
    ScenarioFloatMetric:
      type: object
      additionalProperties: false
      required: [current, scenario, impact, coverage]
      properties:
        current: {$ref: "#/components/schemas/ScenarioFloatComponent"}
        scenario: {$ref: "#/components/schemas/ScenarioFloatComponent"}
        impact: {$ref: "#/components/schemas/ScenarioFloatComponent"}
        impactPct: {type: [number, "null"]}
        impactPoints: {type: [number, "null"]}
        coverage: {$ref: "#/components/schemas/ScenarioCoverage"}
    ScenarioMoneyComponent:
      type: object
      additionalProperties: false
      required: [availability, valueMinor, reasonCodes]
      properties:
        availability:
          type: string
          enum: [available, partial, unavailable]
        valueMinor: {type: [integer, "null"], format: int64}
        reasonCodes:
          type: array
          items: {type: string}
    ScenarioMoneyMetric:
      type: object
      additionalProperties: false
      required: [marketId, currencyCode, current, scenario, impact, coverage]
      properties:
        marketId: {type: string}
        currencyCode: {type: string}
        current: {$ref: "#/components/schemas/ScenarioMoneyComponent"}
        scenario: {$ref: "#/components/schemas/ScenarioMoneyComponent"}
        impact: {$ref: "#/components/schemas/ScenarioMoneyComponent"}
        coverage: {$ref: "#/components/schemas/ScenarioCoverage"}
    ScenarioReportingMoneyMetric:
      type: object
      additionalProperties: false
      required:
        - currencyCode
        - rateMapContentFingerprint
        - current
        - scenario
        - impact
        - coverage
      properties:
        currencyCode: {type: [string, "null"]}
        rateMapContentFingerprint:
          type: [string, "null"]
          pattern: ^[0-9a-f]{64}$
        current: {$ref: "#/components/schemas/ScenarioMoneyComponent"}
        scenario: {$ref: "#/components/schemas/ScenarioMoneyComponent"}
        impact: {$ref: "#/components/schemas/ScenarioMoneyComponent"}
        coverage: {$ref: "#/components/schemas/ScenarioCoverage"}
    ScenarioAppliedPrice:
      type: object
      additionalProperties: false
