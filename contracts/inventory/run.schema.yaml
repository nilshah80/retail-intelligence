$schema: https://json-schema.org/draft/2020-12/schema
$id: https://retail-intelligence.local/contracts/inventory/run.schema.yaml
title: Retail inventory & replenishment run manifest
description: >-
  Manifest for one immutable inventory/replenishment bundle
  (retail-inventory-replenishment-run/v1). One run identity binds the source
  pin, the accepted forecast authority, the resolved policy, the lane/term
  contracts, the replay schedule and every output artifact hash. A change to any
  semantic input creates a NEW run; a run is never repointed to a new forecast
  or policy, and run identity is not activation authority scope (decision #90
  owns that).
type: object
additionalProperties: false
required:
  - schemaVersion
  - inventoryRunId
  - semanticFingerprint
  - createdAt
  - decisionAsOf
  - retailerId
  - tenantId
  - environment
  - markets
  - inputBundle
  - sourceSelectionId
  - forecastAuthority
  - intervalAvailability
  - policy
  - laneContract
  - eventPlacementPolicy
  - replay
  - cohorts
  - engineVersion
  - randomSeeds
  - lifecycleStatus
  - executionProfile
  - fingerprintContract
  - artifacts
properties:
  schemaVersion:
    const: retail-inventory-replenishment-run/v1
  inventoryRunId:
    type: string
    pattern: ^ir_[0-9a-f]{16}$
  semanticFingerprint:
    $ref: "#/$defs/sha256"
  createdAt:
    type: string
    format: date-time
  decisionAsOf:
    type: string
    format: date-time
  retailerId:
    type: string
    pattern: ^[a-z][a-z0-9-]{2,63}$
  tenantId:
    type: string
    pattern: ^[a-z][a-z0-9-]{2,63}$
  environment:
    enum: [local, dev, staging, prod]
  markets:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
  inputBundle:
    description: >-
      The curated source publication this run consumed, byte-identified. The
      forecast below must share this exact publication fingerprint: a forecast
      accepted on a different pin is a different world.
    type: object
    additionalProperties: false
    required:
      - sourceSnapshotId
      - gateASemanticFingerprint
      - gateBSemanticFingerprint
      - publicationSemanticFingerprint
    properties:
      sourceSnapshotId:
        $ref: "#/$defs/sha256"
      gateASemanticFingerprint:
        $ref: "#/$defs/sha256"
      gateBSemanticFingerprint:
        $ref: "#/$defs/sha256"
      publicationSemanticFingerprint:
        $ref: "#/$defs/sha256"
  sourceSelectionId:
    description: >-
      The ACTIVE decision-#73 selection that authorized this publication for
      this scope. A file-level pin is not authority; this field is what makes
      "who approved this source" answerable from the run itself.
    type: string
    pattern: ^sel_[0-9a-f]{16}$
  forecastAuthority:
    type: object
    additionalProperties: false
    required:
      - forecastRunId
      - forecastVersionId
      - runSemanticFingerprint
      - acceptanceSchemaVersion
      - coverageGateMode
    properties:
      forecastRunId:
        type: string
        pattern: ^fr_[0-9a-f]{16}$
      forecastVersionId:
        type: string
        pattern: ^fv_[0-9a-f]{16}$
      runSemanticFingerprint:
        $ref: "#/$defs/sha256"
      acceptanceSchemaVersion:
        const: retail-forecast-acceptance/v5
      coverageGateMode:
        const: hard
  intervalAvailability:
    description: >-
      Decision #92 as consumed. Every interval consumer in this run derived its
      required horizon from origin-safe lead time plus review period and
      branched on interval_available -- never on P90 nullability, and never by
      coercing a withheld interval to zero.
    type: object
    additionalProperties: false
    required:
      - policyId
      - calibratedMaxHorizon
      - reasonCode
      - consumersEnabled
    properties:
      policyId:
        const: retail-forecast-interval-availability/v1
      calibratedMaxHorizon:
        const: 4
      reasonCode:
        const: COLD_START_INTERVAL_UNCALIBRATED
      consumersEnabled:
        type: boolean
  policy:
    type: object
    additionalProperties: false
    required:
      - policyVersion
      - resolvedFingerprints
    properties:
      policyVersion:
        const: inventory-policy/2.0.0
      resolvedFingerprints:
        description: One resolved fingerprint per supported market/currency.
        type: object
        minProperties: 1
        additionalProperties:
          $ref: "#/$defs/sha256"
  laneContract:
    type: object
    additionalProperties: false
    required: [laneCount, fulfillmentCoveragePct]
    properties:
      laneCount:
        type: integer
        minimum: 1
      fulfillmentCoveragePct:
        description: >-
          Share of fulfillment rows resolving to an active typed lane at their
          corrected effective visibility. 100 is the gate; anything lower names
          rows the network cannot explain.
        type: number
        minimum: 0
        maximum: 100
  eventPlacementPolicy:
    type: object
    additionalProperties: false
    required: [rule]
    properties:
      rule:
        const: known_as_of_gte_event_time
  replay:
    type: object
    additionalProperties: false
    required:
      - clock
      - origins
      - incumbentPolicyId
      - oracleTolerance
    properties:
      clock:
        type: object
        additionalProperties: false
        required: [periodGrain, openingSnapshot, timezones]
        properties:
          periodGrain:
            const: market_local_iso_week
          openingSnapshot:
            const: immediately_preceding_thursday
          timezones:
            type: array
            minItems: 1
            items:
              type: string
      origins:
        type: array
        minItems: 1
        items:
          type: string
          format: date
      incumbentPolicyId:
        description: >-
          Versioned id from the source simulator config. Inferring the incumbent
          from outcomes is forbidden: an incumbent fitted to the result is not a
          baseline, it is a second candidate.
        type: string
        minLength: 1
      oracleTolerance:
        type: object
        additionalProperties: false
        required: [meanAbsUnitDeltaPerCell, frozenBeforeScoring]
        properties:
          meanAbsUnitDeltaPerCell:
            type: string
          frozenBeforeScoring:
            const: true
  cohorts:
    type: object
    additionalProperties: false
    required: [hashVersion, seed, calibrationPct, holdoutPct, keyFields]
    properties:
      hashVersion:
        const: cohort-assignment/v1
      seed:
        type: integer
      calibrationPct:
        const: "5"
      holdoutPct:
        const: "95"
      keyFields:
        type: array
        items:
          type: string
        minItems: 5
        maxItems: 5
  engineVersion:
    type: string
    minLength: 1
  randomSeeds:
    type: object
    minProperties: 1
    additionalProperties:
      type: integer
  lifecycleStatus:
    enum: [candidate, accepted, rejected]
  executionProfile:
    description: Telemetry, excluded from semantic identity.
    type: object
  fingerprintContract:
    type: object
    additionalProperties: false
    required: [spec, volatilePointers]
    properties:
      spec:
        const: semantic-fingerprint/v1
      volatilePointers:
        type: array
        items:
          type: string
  artifacts:
    description: >-
      Every output artifact with row count and content hash. The verifier
      recomputes these; a manifest hash nothing checks is a manifest hash
      nothing means.
    type: object
    additionalProperties: false
    required:
      - inventory_positions
      - stock_health
      - demand_at_risk
      - inventory_ageing
      - inventory_expiry_waste
      - inventory_valuation
      - replenishment_recommendations
      - safety_stock_segments
      - transfer_recommendations
      - allocation_recommendations
      - supplier_planning
      - replenishment_exceptions
      - replay_metrics
    properties:
      inventory_positions: {$ref: "#/$defs/artifact"}
      stock_health: {$ref: "#/$defs/artifact"}
      demand_at_risk: {$ref: "#/$defs/artifact"}
      inventory_ageing: {$ref: "#/$defs/artifact"}
      inventory_expiry_waste: {$ref: "#/$defs/artifact"}
      inventory_valuation: {$ref: "#/$defs/artifact"}
      replenishment_recommendations: {$ref: "#/$defs/artifact"}
      safety_stock_segments: {$ref: "#/$defs/artifact"}
      transfer_recommendations: {$ref: "#/$defs/artifact"}
      allocation_recommendations: {$ref: "#/$defs/artifact"}
      supplier_planning: {$ref: "#/$defs/artifact"}
      replenishment_exceptions: {$ref: "#/$defs/artifact"}
      replay_metrics: {$ref: "#/$defs/artifact"}
$defs:
  sha256:
    type: string
    pattern: ^[0-9a-f]{64}$
  artifact:
    type: object
    additionalProperties: false
    required: [path, rows, sha256]
    properties:
      path:
        type: string
        minLength: 1
      rows:
        type: integer
        minimum: 0
      sha256:
        $ref: "#/$defs/sha256"
