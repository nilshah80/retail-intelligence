schemaVersion: retail-inventory-policy/v1
policyVersion: inventory-policy/1.0.0

# These controls are dimensionless or unit/time based and can be shared across
# markets. Any future money threshold belongs in a marketCurrencyRule instead.
globalDefaults:
  serviceLevelsByClass:
    A: "0.96"
    B: "0.9"
    C: "0.8"
  reviewPeriodDays: 7
  maxCoverDays: 30
  holdDeclineThreshold: "0.15"
  holdCoverDays: 14
  markdownCoverDays: 21
  markdownPct: "0.1"
  calibrationCohortPct: "5"
  validationHoldoutPct: "95"
