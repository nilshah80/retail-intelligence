[project]
name = "retail-contracts"
version = "0.1.0"
description = "Canonical retail_v2 semantic contract shared by Retail Intelligence ingestion and ML"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.21",
  "rfc8785>=0.1.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
retail_contracts = ["data/**/*.yaml", "data/**/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
