schemaVersion: retail-screen-contract/v1
screenId: demandForecast
status: frozen_approved_for_implementation
authority:
  html: docs/ai_retail_intelligence_dashboard_multicurrency_v6.html
  pageSelector: "#demandForecast"
  specification: docs/demand_forecast_poc_spec.md
  tasks: plans/local/tasks.md
  api: contracts/api/openapi.yaml
dataMode: accepted_live_only

activation:
  verifier: retail_ml.publish.verify.verify_forecast_run
  requiredLifecycleStatus: accepted
  requiredAcceptanceVerdict: true
  # Reconciled at P4-0. This block still read `no_accepted_forecast` with three
  # null identity fields while a hard-gated acceptance-v5 forecast had been active
  # and serving since 2026-07-31. A screen contract that denies the run it renders
  # is the same class of stale evidence as the closure record's 0007 pin.
  currentState: accepted_forecast_active
  forecastRunId: fr_357575f586905b11
  versionId: fv_3d66e3bd9939430d
  semanticFingerprint: fd0ac67c907290ab79ec6202cac04288d64eeb12b31f5023860591fd203653c3
  acceptanceSchemaVersion: retail-forecast-acceptance/v5
  coverageGateMode: hard
  servingMigration: 0008_nullable_withheld_interval
  intervalAvailability:
    policyId: retail-forecast-interval-availability/v1
    calibratedMaxHorizon: 4
    withheldRows: 8756
    withheldSeries: 398
    reasonCode: COLD_START_INTERVAL_UNCALIBRATED
  rejectedHistoricalRunId: fr_92135aa7b5215b69
  rejectionReason: INCOMPLETE_SEASONAL_NAIVE_COMPARISON
  fixturesAllowedInLiveScreen: false

reviewGate:
  reactImplementationAuthorized: true
  authorizedAt: "2026-07-30"
  authorization: User directed completion of the entire Phase 3.
  resolvedDecision:
    Q1: >-
      Forecast vs Actual shows the eight most recent completed target weeks.
      Each week is one governed h1 forecast/actual aggregate pair.
    Q2: >-
      Stores come from current accepted forecast_stores and display as
      "{name}, {city}" unless the city is already present in the name.
    Q3: >-
      Weekly is live. Monthly is a sum of weekly values by target month.
      Daily is visible but disabled because no governed disaggregation exists.
    Q4: The Category filter uses the canonical product category grain.
    Q5: >-
      KPI deltas stay Not available until a second comparable accepted version
      exists; prior-period values never substitute for version comparison.
    Q6: >-
      Forecast Health always renders exact h1, h4, h8 and h13 rows, independent
      of the selected operational horizon cap. H26 remains diagnostic and is
      not a fifth default row. Status follows decision #80.
    Q7: >-
      Workbench AI Forecast and MA13 baseline are sums across h1 through the
      selected horizon; Last Actual is the latest completed weekly actual.
    Q8: >-
      Relative time is computed from known_as_of to forecast decisionAsOf,
      never wall clock. Missing known_as_of renders Not available.
    Q9: >-
      Global and page Store controls share one state. Channel intersects page
      filters. Topbar date is historical context; page horizon is future.
      Currency is independent and cannot alter unit or percentage measures.
    Q10: >-
      Baseline is the governed MA13 evaluation model and current is the active
      accepted AI version. Prior and planner versions remain Not available.
    Q11: >-
      Unavailable controls remain in reference order with native disabled and
      aria-disabled states plus a tooltip naming the owning future phase.
    Q12: Screenshot baselines use 1440x1100 desktop and 390x844 responsive.
    Q13: >-
      The shared currency/FX shell remains visible, but no unit or percentage
      value is converted. Demand at Risk and Business Impact stay Not available.
    Q14: >-
      Action Center shows live governed exception counts; Store Drilldown shows
      live store accuracy, bias and coverage; Compare Versions shows MA13 and
      current AI. Unsupported business, prior and planner values stay Not available.
    Q15: >-
      FVA is relative WAPE improvement versus MA13 and is rendered as a percent
      everywhere, never as percentage points.
    Q16: >-
      Forecast Coverage is distinct active forecast SeriesKeys divided by
      distinct governed forecast_data_quality SeriesKeys for the accepted version.
    Q17: >-
      event_snap is published under Weather and local events. Five live groups
      renormalize to 100%; Promotion plan stays visible and unavailable.
    Q18: >-
      Decision #60 and contracts/ml/forecast-classification-policy.json freeze
      the five exception formulas, thresholds/severity, unavailable-promotion
      behavior, and per-series Good/Watch/Issue quality battery.
    Q19: >-
      Decision #92 withholds the cold-start P90 and its derived confidence beyond
      h4 while retaining P50 at every horizon, so a selected window of 8, 13 or 26
      weeks mixes horizons that carry an interval with horizons that do not. Two
      workbench cells are affected and each is frozen separately.
      CONFIDENCE is unavailable when the window is mixed. Its arithmetic is
      corrected first -- the max(P50,1)-weighted mean of decision #12 is restricted
      to the weeks that carry an interval on BOTH sides of its ratio, so a retained
      P50 weight can no longer dilute a numerator that skipped it -- and the
      corrected value is then withheld from display rather than shown, because an
      h1-h4 number under a heading reading "Confidence", beside forecast values
      covering the whole selection, states a scope the screen does not. That is the
      failure decision #78 exists to prevent, and the approved element-level
      unavailable state already has a defined rendering. The corrected value
      remains the internal reference the regression asserts.
      THE INTERVAL TOTAL (aiForecastP90) is absent with a governed reason whenever
      the window contains a withheld week. Confining the sum to h1-h4 would remove
      the population mismatch and still label a sum of weekly upper bounds as an
      interval for a multi-week total, which was never true and is not made true by
      scoping. This choice changes no rendered element: the field is carried in the
      payload and rendered nowhere.
      At a 4-week selection nothing is withheld, so both cells stay numeric and
      unchanged. Silently blending the two horizon populations in one cell is not
      an admissible outcome for either field.
  pendingDecisions: {}

# --------------------------------------------------------------------------
# Versioned amendments to this frozen contract. An amendment is appended here
# with its own id and approval; a frozen contract is never silently edited.
# --------------------------------------------------------------------------
amendments:
  - amendmentId: P4-0P-A1
    amendedAt: "2026-08-01"
    package: P4-0P
    decisionIds: [12, 64, 78, 85, 92]
    decisionAmendment: "Decision #64 Q19"
    title: Cold-start interval scope in the SKU workbench
    defectRepaired: >-
      plans/local/phase4-implementation-plan.md §1.3.1. Two served aggregates were
      written when every row carried an interval. SUM skips nulls, so after decision
      #92's withholding the confidence numerator omitted the withheld weeks while
      its denominator still counted their retained P50 weight, and SUM(yhat_p90)
      covered only h1-h4 beside a central total covering the whole selection.
      Measured on the live active version over the 398 affected series at 26 weeks:
      served weighted confidence 0.0814 against a covered-week 0.5817, and 372 of
      398 series returned an interval total below their own central total. The
      defect applies at 8, 13 and 26 weeks -- every selection the screen offers
      except the 4-week default -- and nothing coerces a null, so no null-handling
      check could catch it.
    affectedElements:
      - "#forecastWorkbenchTable column Confidence"
      - forecastWorkbench.aiForecastP90 (payload only; rendered nowhere)
    frozenBehavior:
      confidence: unavailable_when_mixed
      intervalTotal: absent_with_governed_reason_when_mixed
    rendersNewElement: false
    approval:
      status: approved
      actor: nilay.shah
      approvedAt: "2026-08-01"
      authorization: >-
        Explicit user instruction to complete Phase 4 autonomously, deciding
        without pausing for input and documenting any deviation for review. The
        plan's own recommendation for both fields was adopted unchanged.
      classification: autonomous_authorization_not_independent_human_review
      reviewOutstanding: >-
        A per-screen human visual review of the amended Confidence cell is still
        owed and is tracked as a P4-0P deviation, not as a completed approval.

shell:
  inheritFrom: contracts/screens/data-management.yaml
  topbar:
    title: Demand Forecast
    subtitle: Forecast demand by SKU, store, channel and time
  navigation:
    activeItem: Demand Forecast
    preserveReferenceOrder: true
    phaseOrRoadmapLabelsAllowed: false
  footer:
    left: AI Retail Intelligence — Dynamic Pricing & Demand Forecasting
    right: Powered by AI • Built for Retail
    slots:
      - label: Total SKUs
        source: curated.products
        status: live
      - label: Active SKUs
        source: curated.assortment_calendar
        status: live
      - label: Stores
        source: curated.stores
        status: live
      - label: Channels
        source: accepted publication business channel types
        status: live
      - label: Forecast Coverage
        source: distinct current forecast SeriesKeys / governed quality SeriesKeys
        status: live_when_forecast_accepted
      - label: Data Freshness
        source: contextual known_as_of relative to decision_as_of
        status: live_when_forecast_accepted
      - label: Model Accuracy (all horizons)
        source: forecast_metrics global champion accuracy
        status: live_when_forecast_accepted
        horizonScope: h1-h26
        scopeNote: >-
          Labelled "all horizons" because the Demand Forecast accuracy tile is scoped to
          the selected horizon window. Both figures are correct; unlabelled they read as
          a contradiction (92.8 here, 93.8 there). Decision #78 requires exact grain and
          horizon to be visible.

actions:
  - selector: "#acceptForecastBtn"
    label: Accept Forecast
    order: 1
    status: unavailable_phase_6
  - selector: "#addForecastAdjustmentBtn"
    label: Add Planner Adjustment
    order: 2
    status: unavailable_phase_6
  - selector: "#compareForecastVersionsBtn"
    label: Compare Versions
    order: 3
    status: live_when_forecast_accepted
    behavior: Compare governed MA13 baseline with the active accepted AI version.
  - selector: "#forecastScenarioBtn"
    label: Scenario Planning
    order: 4
    status: unavailable_phase_5
  - selector: "#forecastActionCenterBtn"
    label: Forecast Action Center
    order: 5
    status: live_when_forecast_accepted
    behavior: Show governed current-cycle exception counts.
  - selector: "#exportForecastBtn"
    label: Export
    order: 6
    status: live_when_forecast_accepted
    behavior: Export the active live table; never export sample HTML rows.

filters:
  precedence:
    status: frozen
    rule: >-
      Global and page Store controls share one state; Channel intersects page
      filters; historical date, future horizon and currency remain independent.
  controls:
    - selector: "#forecastRegionFilter"
      order: 1
      label: All Regions
      source: market-qualified canonical location regions
      status: live_when_forecast_accepted
    - selector: "#forecastStoreFilter"
      order: 2
      label: All Stores
      source: current canonical locations
      status: live_when_forecast_accepted
      displayRule: "{name}, {city}, unless city is already present in name"
    - selector: "#forecastCategoryFilter"
      order: 3
      label: All Categories
      source: canonical product category
      status: live_when_forecast_accepted
    - selector: "#forecastHorizonFilter"
      order: 4
      options: [Next 4 Weeks, Next 8 Weeks, Next 13 Weeks, Next 26 Weeks]
      source: forecast_series.horizon_week
      status: live_when_forecast_accepted
    - selector: "#forecastGranularityFilter"
      order: 5
      options: [Weekly, Daily, Monthly]
      status: partially_available
      behavior:
        Weekly: live
        Monthly: sum weekly values by target month
        Daily: disabled_no_governed_disaggregation
    - selector: "#forecastSearch"
      order: 6
      placeholder: Search product, SKU or store
      fields: [sku_id, product_name, store_label]
      status: live_when_forecast_accepted

kpis:
  selector: "#demandForecast .kpi-grid"
  preserveReferenceOrder: true
  tiles:
    - order: 1
      label: Forecast Accuracy
      source: forecast_metrics champion additive accuracy at active filter slice
      grain: composed evaluation rows
      format: percentage_1dp
      delta:
        status: unavailable_until_comparable_accepted_version
      note: "Target: 90% · h1-h{selected}, {metricGrain}"
      horizonScope: selected_window
      scopeNote: >-
        The scope suffix is derived from the live horizon selector and the grain the API
        reports, never hard-coded, so the label cannot drift from the number beside it.
      status: live_when_forecast_accepted
    - order: 2
      label: Forecast Bias
      source: forecast_metrics champion signed_error_sum / actual_sum
      grain: composed evaluation rows
      format: signed_percentage_1dp
      delta:
        status: unavailable_until_comparable_accepted_version
      note: "Target range: ±5% · h1-h{selected}, {metricGrain}"
      horizonScope: selected_window
      scopeNote: >-
        Labelling matters more here than for accuracy: bias reads -2.1% over h1-h4
        against the stated +/-5% target but -5.41% over h1-h26, so an unlabelled tile can
        appear to pass a target the full panel does not.
      status: live_when_forecast_accepted
    - order: 3
      label: Demand at Risk
      status: unavailable_phase_4
      unavailablePresentation: Not available
    - order: 4
      label: Planner Overrides
      status: unavailable_phase_6
      unavailablePresentation: Not available
    - order: 5
      label: Forecast Value Add
      source: forecast_metrics champion FVA versus MA13
      grain: composed evaluation rows
      format: relative_percentage_1dp
      status: live_when_forecast_accepted

tabs:
  selector: "#forecastTabs"
  default: Overview
  preserveReferenceOrder: true
  items:
    - {label: Overview, panel: "#forecastOverviewPanel"}
    - {label: Store View, panel: "#forecastStorePanel"}
    - {label: SKU View, panel: "#forecastSkuPanel"}
    - {label: Demand Drivers, panel: "#forecastDriversPanel"}
    - {label: Governance, panel: "#forecastGovernancePanel"}

panels:
  - selector: "#forecastOverviewPanel"
    label: Overview
    elements:
      - selector: "#forecastOverviewPanel .grid-2 .card:nth-child(1)"
        label: Forecast vs Actual
        linkLabel: Last 8 weeks
        source: forecast_eval_predictions
        grain: scoring_origin × SeriesKey × horizon
        displayRule: eight most recent completed target weeks using h1 aggregates
        status: live_when_forecast_accepted
      - selector: "#forecastOverviewPanel .grid-2 .card:nth-child(2)"
        label: Forecast Health by Horizon
        linkLabel: Accuracy and bias
        source: forecast_metrics
        columns: [Horizon, Accuracy, Bias, Coverage, Status]
        coverageDefinition: empirical P90 coverage
        metricSemantics: exact_horizon_additive
        checkpoints: [1, 4, 8, 13]
        independentOfOperationalHorizonCap: true
        diagnosticOnlyCheckpoints: [26]
        healthPolicy:
          ref: contracts/ml/forecast-health-policy.json
          policyId: retail-forecast-health/v1
          semanticFingerprint: 569dd287b494fd1b9f5968032e3a2f8073feafea1fb00bf497d1c040d0488a80
        knownDeviation:
          code: PP3_B7_REACT_IMPLEMENTATION_PENDING
          status: resolved
          resolvedOn: 2026-07-31
          previousBehavior: >-
            React filtered [1,4,8,13,26] by the selected operational horizon,
            aggregated 1..N cumulatively and derived status from coverage only.
          implementedBehavior: >-
            ui/src/Forecast.tsx renders exactly four exact-horizon rows labelled
            `1 week`, `4 weeks`, `8 weeks`, `13 weeks`, independent of the
            operational horizon cap, and evaluates retail-forecast-health/v1
            through generated constants in ui/src/generated/forecastHealthPolicy.ts
            so governed thresholds are never hand-copied.
          remainingObligation: >-
            Live-value and screenshot parity cannot be exercised while forecast
            serving is fail-closed under the NO-GO closure. DOM, ordering,
            filter-independence and status-matrix behaviour are covered by tests.
        referenceSamplePolicy:
          layoutAuthoritative: true
          coverageAndBadgeValuesAuthoritative: false
          reason: >-
            The HTML sample coverages exceed the accepted interval and its
            sample badges do not implement decision #80.
        status: live_when_forecast_accepted
      - selector: "#forecastOverviewPanel .grid-3 .card:nth-child(1)"
        label: Forecast Exceptions
        linkLabel: Current cycle
        rows:
          - High under-forecast risk
          - High over-forecast risk
          - New product / sparse history
          - Promotion uplift conflict
          - Data-quality exception
        source: forecast_exceptions
        status: live_when_forecast_accepted
        unavailablePresentation: Not available
      - selector: "#forecastOverviewPanel .grid-3 .card:nth-child(2)"
        label: Forecast Value Add
        linkLabel: AI vs baseline
        rows:
          - label: Statistical baseline accuracy
            source: forecast_metrics MA13 accuracy
            status: live_when_forecast_accepted
          - label: AI forecast accuracy
            source: forecast_metrics champion accuracy
            status: live_when_forecast_accepted
          - label: Planner-adjusted accuracy
            status: unavailable_phase_6
          - label: Net FVA
            source: forecast_metrics champion versus MA13
            format: relative_percentage_1dp
            status: live_when_forecast_accepted
          - label: Overrides adding value
            status: unavailable_phase_6
      - selector: "#forecastOverviewPanel .grid-3 .card:nth-child(3)"
        label: Business Impact
        linkLabel: Projected
        rows:
          - Stock-out reduction
          - Excess inventory reduction
          - Markdown reduction
          - Working capital release
          - Service-level improvement
        status: unavailable_phase_4
        unavailablePresentation: Not available

  - selector: "#forecastStorePanel"
    label: Store View
    elements:
      - selector: "#storeForecastDrilldownBtn"
        label: Open Store Drilldown
        status: live_when_forecast_accepted
        behavior: Show live store accuracy, bias and coverage only.
      - selector: "#storeForecastTable"
        label: Store Forecast Performance
        rowGrain: store
        columns:
          - {label: Store, source: forecast_stores name and city, status: live_when_forecast_accepted}
          - {label: Forecast Accuracy, source: forecast_metrics store accuracy, status: live_when_forecast_accepted}
          - {label: Bias, source: forecast_metrics store bias, status: live_when_forecast_accepted}
          - {label: Demand at Risk, status: unavailable_phase_4}
          - {label: Stock-out Risk, status: unavailable_phase_4}
          - {label: Override Rate, status: unavailable_phase_6}
          - {label: Priority Action, status: unavailable_no_frozen_business_rule}

  - selector: "#forecastSkuPanel"
    label: SKU View
    elements:
      - selector: "#forecastRecordCount"
        source: filtered forecast_series count
        status: live_when_forecast_accepted
      - selector: "#forecastWorkbenchTable"
        label: SKU-Store Forecast Workbench
        rowGrain: version × SeriesKey
        preserveHorizontalScrollContainer: true
        columns:
          - {label: Select, selector: "#selectAllForecastRows", status: live_when_forecast_accepted}
          - {label: Priority, source: forecast_exceptions.severity, status: live_when_forecast_accepted}
          - {label: SKU / Product, source: curated products product_name and sku_id, status: live_when_forecast_accepted}
          - {label: Store, source: forecast_stores name and city, status: live_when_forecast_accepted}
          - {label: Baseline, source: forecast_baseline_predictions MA13, status: live_when_forecast_accepted}
          - {label: AI Forecast, source: forecast_series yhat_p50 sum h1 through selected horizon, status: live_when_forecast_accepted}
          - {label: Planner Forecast, status: unavailable_phase_6}
          - {label: Last Actual, source: forecast_eval_predictions latest completed target, status: live_when_forecast_accepted}
          - {label: Accuracy, source: forecast_metrics series accuracy, status: live_when_forecast_accepted}
          - {label: Bias, source: forecast_metrics series bias, status: live_when_forecast_accepted}
          - label: Confidence
            source: forecast_series.confidence
            status: live_when_forecast_accepted
            # P4-0P amendment A1. See reviewGate.resolvedDecision.Q19.
            intervalScope:
              rule: unavailable_when_window_mixes_published_and_withheld_intervals
              weighting: max(P50,1)-weighted mean per decision #12
              population: >-
                Restricted on BOTH sides of the ratio to the horizon weeks that
                carry an interval. A retained P50 weight may never appear in a
                denominator whose numerator skipped it.
              mixedWindowPresentation: Not available
              mixedWindowReasonCode: COLD_START_INTERVAL_UNCALIBRATED
              cleanSelections: [4]
              mixedSelections: [8, 13, 26]
              amendedBy: P4-0P
          - {label: Primary Driver, source: forecast_drivers highest live contribution, status: live_when_forecast_accepted}
          - {label: Data Quality, source: forecast_data_quality, status: live_when_forecast_accepted}
          - {label: Status, source: governed current-cycle exception presence, status: live_when_forecast_accepted}

  - selector: "#forecastDriversPanel"
    label: Demand Drivers
    elements:
      - selector: "#forecastDriversPanel .card:nth-child(1)"
        label: Demand Driver Contribution
        linkLabel: Portfolio level
        columns: [Driver, Contribution, Direction, Confidence]
        rows:
          - {label: Base demand trend, driver: demand_trend, status: live_when_forecast_accepted}
          - {label: Promotion plan, driver: promo, status: unavailable_on_current_pin}
          - {label: Seasonality, driver: seasonality, status: live_when_forecast_accepted}
          - {label: Price movement, driver: price, status: live_when_forecast_accepted}
          - {label: Competitor availability, driver: competitor_activity, status: live_when_forecast_accepted}
          - {label: Weather and local events, driver: weather_local_events, status: live_when_forecast_accepted}
        liveContributionTotal: "100.0000"
      - selector: "#forecastDriversPanel .card:nth-child(2)"
        label: External Signal Readiness
        rows:
          - {label: Promotion calendar, status: unavailable_on_current_pin}
          - {label: Competitor pricing, source: competitor latest known_as_of}
          - {label: Weather feed, source: weather latest known_as_of}
          - {label: Local event feed, status: unavailable_on_current_pin, reasonCode: NO_ORIGIN_VISIBLE_LOCAL_EVENT_PLAN}
          - {label: Macroeconomic index, source: macro latest known_as_of}
        freshnessBaseline: forecast_run.decisionAsOf
        relativeTime:
          status: frozen
          rule: Compare known_as_of with decisionAsOf; missing timestamps are Not available.

  - selector: "#forecastGovernancePanel"
    label: Governance
    elements:
      - selector: "#forecastGovernancePanel .card:nth-child(1)"
        label: Forecast Approval & SLA
        columns: [Workflow Stage, Open, Average Age, SLA, Status]
        status: unavailable_phase_6
        unavailablePresentation: Not available
      - selector: "#forecastGovernancePanel .card:nth-child(2)"
        label: Model & Data Controls
        rows:
          - {label: Forecast version traceability, source: accepted manifest lineage, status: live_when_forecast_accepted}
          - {label: Planner override comments, status: unavailable_phase_6}
          - {label: Data freshness compliance, source: feed known_as_of relative to decisionAsOf, status: live_when_forecast_accepted}
          - {label: Model drift within tolerance, status: pending_at_least_two_versions}
          - {label: Back-testing coverage, source: forecast_eval_predictions distinct evaluated SeriesKey share, status: live_when_forecast_accepted}

modals:
  - trigger: "#forecastActionCenterBtn"
    title: Forecast Action Center
    status: live_when_forecast_accepted
  - trigger: "#storeForecastDrilldownBtn"
    title: Open Store Drilldown
    status: live_when_forecast_accepted
  - trigger: "#compareForecastVersionsBtn"
    title: Compare Versions
    status: live_when_forecast_accepted

behavior:
  loading: Preserve the reviewed shell and element positions; show loading in value regions.
  error: Preserve the shell and state that live forecast data is unavailable.
  empty: Show zero only for an exact governed zero under a frozen policy.
  unavailable: Use the literal text Not available; never substitute HTML sample values.
  rejectedCandidate: Treat exactly like unavailable; rejection evidence belongs outside the business screen.
