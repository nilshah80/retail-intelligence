schemaVersion: retail-source-profile/v1
profileId: retail-datagen-multi-source
profileVersion: "1.3.0"
sourceSystem: generator
sourceSchemaVersion: retail-source-config/v13
businessTimezone: source_location_timezone
extractWindow:
  start: "2016-07-28"
  end: "2026-07-28"
channelPolicy:
  mode: native
assortmentPolicy:
  mode: native_store_assortment
money:
  sourceUnit: major_decimal
  taxBasis: source_field
  currencyField: currencyCode
  taxBasisField: taxesIncluded_or_companyMarketConfiguration.taxBasis
quantityPolicy:
  mode: entity_semantics
  derivationRule: >-
    Transaction quantities are item counts; measurementUnit/measurementValue and
    Business Central unitOfMeasureCode preserve pack, weight and volume semantics.
mappingReferences:
  - companyMarketConfiguration.marketCode
  - locations.marketCode
  - companion.marketKey
  - Shopify.locationId
  - BusinessCentral.locationCode
locationOverrides:
  - sourceInstance: northstar-in
    sourceLocationKey: gid://shopify/Location/1024194649283697776
    city: Pune
  - sourceInstance: northstar-in
    sourceLocationKey: gid://shopify/Location/1641883440496225609
    city: Pune
  - sourceInstance: northstar-us
    sourceLocationKey: gid://shopify/Location/3369969851126252177
    city: New York
    canonicalName: Brooklyn
  - sourceInstance: northstar-us
    sourceLocationKey: gid://shopify/Location/1973290622021115537
    city: New York
    canonicalName: Manhattan
sourceInstances:
  - sourceSystem: shopify
    sourceInstance: northstar-in
    logicalPathPrefix: shopify/northstar-in/
    sourceMarketId: india-mumbai
    marketId: india-west
    currencyCode: INR
    timezone: Asia/Kolkata
    capabilities: [commerce]
  - sourceSystem: shopify
    sourceInstance: northstar-us
    logicalPathPrefix: shopify/northstar-us/
    sourceMarketId: us-new-york
    marketId: us-new-york
    currencyCode: USD
    timezone: America/New_York
    capabilities: [commerce]
  - sourceSystem: businessCentral
    sourceInstance: bc-northstar-in
    logicalPathPrefix: business-central/bc-northstar-in/
    sourceMarketId: india-mumbai
    marketId: india-west
    currencyCode: INR
    timezone: Asia/Kolkata
    capabilities: [operations]
  - sourceSystem: businessCentral
    sourceInstance: bc-northstar-us
    logicalPathPrefix: business-central/bc-northstar-us/
    sourceMarketId: us-new-york
    marketId: us-new-york
    currencyCode: USD
    timezone: America/New_York
    capabilities: [operations]
  - sourceSystem: companion
    sourceInstance: india-mumbai
    logicalPathPrefix: companion/india-mumbai/
    sourceMarketId: india-mumbai
    marketId: india-west
    currencyCode: INR
    timezone: Asia/Kolkata
    capabilities: [external_signals]
  - sourceSystem: companion
    sourceInstance: us-new-york
    logicalPathPrefix: companion/us-new-york/
    sourceMarketId: us-new-york
    marketId: us-new-york
    currencyCode: USD
    timezone: America/New_York
    capabilities: [external_signals]
publicationRequirements:
  requiredCapabilities: [commerce, operations, external_signals]
authenticity:
  mode: not_required_for_snapshot
datasets:
  - &staged
    sourceSystem: businessCentral
    datasetId: companyMarketConfiguration
    classification: staged
    permissionLane: public
    format: parquet
    sourceKeys: [companyId]
    grainFields: [companyId]
    columnPolicies: []
  - <<: *staged
    datasetId: customers
    sourceKeys: [id]
    grainFields: [id]
  - <<: *staged
    datasetId: inboundShipments
    sourceKeys: [shipmentId]
    grainFields: [shipmentId]
  - <<: *staged
    datasetId: inboundStatusEvents
    sourceKeys: [shipmentId, sku, status]
    grainFields: [shipmentId, sku, status, statusEffectiveAt]
  - <<: *staged
    datasetId: supplyTerms
    sourceKeys: [vendorId, destinationLocationCode, merchScopeType, merchScopeId]
    grainFields: [vendorId, destinationLocationCode, merchScopeType, merchScopeId, effectiveFrom]
  - <<: *staged
    datasetId: storeInventorySnapshots
    sourceKeys: [locationCode, sku, observedAt]
    grainFields: [locationCode, sku, observedAt]
  - <<: *staged
    datasetId: storeTransferEvents
    sourceKeys: [transferId, status]
    grainFields: [transferId, sku, status, statusEffectiveAt]
  - <<: *staged
    datasetId: storeWasteEvents
    sourceKeys: [eventId]
    grainFields: [eventId]
  # Source contract v13: the part of a store sale the shelf could not cover, which
  # the DC fulfilled. Same classification and lane as the other store-echelon
  # relations -- it carries no identifiers a customer could be recovered from,
  # only a location, a SKU and three unit counts.
  - <<: *staged
    datasetId: storeStockoutEvents
    sourceKeys: [eventId]
    grainFields: [eventId]
  - <<: *staged
    datasetId: inventorySnapshots
    sourceKeys: [locationCode, sku, observedAt]
    grainFields: [locationCode, sku, observedAt]
  - <<: *staged
    datasetId: itemBatches
    sourceKeys: [batchId]
    grainFields: [batchId]
  - <<: *staged
    datasetId: itemCostLayers
    sourceKeys: [costLayerId]
    grainFields: [costLayerId]
  - <<: *staged
    datasetId: itemLedgerEntries
    sourceKeys: [id]
    grainFields: [id]
  - <<: *staged
    datasetId: itemLifecycleEvents
    sourceKeys: [eventKey]
    grainFields: [eventKey]
  - <<: *staged
    datasetId: itemVariants
    sourceKeys: [id]
    grainFields: [id]
  - <<: *staged
    datasetId: items
    sourceKeys: [id]
    grainFields: [id]
  - <<: *staged
    datasetId: locations
    sourceKeys: [id]
    grainFields: [id]
  - <<: *staged
    datasetId: purchaseOrderLines
    sourceKeys: [id]
    grainFields: [id]
  - <<: *staged
    datasetId: purchaseOrders
    sourceKeys: [id]
    grainFields: [id]
  - <<: *staged
    datasetId: purchasingBudgets
    sourceKeys: [marketCode, periodMonth]
    grainFields: [marketCode, periodMonth]
  - <<: *staged
    datasetId: salesInvoiceLines
    sourceKeys: [id]
    grainFields: [id]
  - <<: *staged
    datasetId: salesInvoices
    sourceKeys: [id]
    grainFields: [id]
  - <<: *staged
    datasetId: supplierCapacityConfirmations
    sourceKeys: [vendorId, marketCode, periodMonth]
    grainFields: [vendorId, marketCode, periodMonth]
  - <<: *staged
    datasetId: supplierPerformance
    sourceKeys: [receiptLineId]
    grainFields: [receiptLineId]
  - <<: *staged
    datasetId: transferOrderLines
    sourceKeys: [id]
    grainFields: [id]
  - <<: *staged
    datasetId: transferOrders
    sourceKeys: [id]
    grainFields: [id]
  - <<: *staged
    datasetId: transferShipments
    sourceKeys: [id]
    grainFields: [id]
  - <<: *staged
    datasetId: vendorItemTerms
    sourceKeys: [vendorId, marketCode, categoryId]
    grainFields: [vendorId, marketCode, categoryId]
    nullableSourceKeys: [categoryId]
  - <<: *staged
    datasetId: vendors
    sourceKeys: [id]
    grainFields: [id]
  - <<: *staged
    datasetId: warehouseCapacity
    sourceKeys: [warehouseId, observedAt]
    grainFields: [warehouseId, observedAt]
  - <<: *staged
    datasetId: warehouseReceiptLines
    sourceKeys: [id]
    grainFields: [id]
  - <<: *staged
    datasetId: warehouseReceipts
    sourceKeys: [id]
    grainFields: [id]
  - <<: *staged
    datasetId: wasteEvents
    sourceKeys: [wasteEventId]
    grainFields: [wasteEventId]
  - <<: *staged
    datasetId: wmsInventoryComparisons
    sourceKeys: [warehouseId, sku, observedAt]
    grainFields: [warehouseId, sku, observedAt]

  - <<: *staged
    sourceSystem: companion
    datasetId: allocationDemandRequests
    sourceKeys: [requestKey]
    grainFields: [requestKey]
  - <<: *staged
    sourceSystem: companion
    datasetId: allocationSupplyPools
    sourceKeys: [poolKey]
    grainFields: [poolKey]
  - <<: *staged
    sourceSystem: companion
    datasetId: competitorMatches
    sourceKeys: [matchKey]
    grainFields: [matchKey]
  - <<: *staged
    sourceSystem: companion
    datasetId: competitorPrices
    sourceKeys: [marketKey, competitorId, competitorSku, targetType, targetId, validDate, observedAt]
    grainFields: [marketKey, competitorId, competitorSku, targetType, targetId, validDate, observedAt]
  - <<: *staged
    sourceSystem: companion
    datasetId: customerSegments
    sourceKeys: [segmentId]
    grainFields: [segmentId]
  - <<: *staged
    sourceSystem: companion
    datasetId: fxRates
    sourceKeys: [marketKey, baseCurrency, quoteCurrency, rateType, rateDate]
    grainFields: [marketKey, baseCurrency, quoteCurrency, rateType, rateDate]
  - <<: *staged
    sourceSystem: companion
    datasetId: holidays
    sourceKeys: [marketKey, date, name]
    grainFields: [marketKey, date, name, targetType, targetId]
  - <<: *staged
    sourceSystem: companion
    datasetId: localEvents
    sourceKeys: [eventId]
    grainFields: [eventId]
  - <<: *staged
    sourceSystem: companion
    datasetId: macroIndex
    sourceKeys: [marketKey, indexName, targetType, targetId, validDate, observedAt]
    grainFields: [marketKey, indexName, targetType, targetId, validDate, observedAt]
  - <<: *staged
    sourceSystem: companion
