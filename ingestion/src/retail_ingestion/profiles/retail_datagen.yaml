  - <<: *staged
    sourceSystem: companion
    datasetId: pandemicSignals
    sourceKeys: [marketKey, validDate, observedAt]
    grainFields: [marketKey, validDate, observedAt]
  - <<: *staged
    sourceSystem: companion
    datasetId: pandemicTimeline
    sourceKeys: [marketKey, pandemicId, phaseId]
    grainFields: [marketKey, pandemicId, phaseId]
  - <<: *staged
    sourceSystem: companion
    datasetId: promotionSkus
    sourceKeys: [marketKey, promotionId, sku, categoryId, departmentId]
    nullableSourceKeys: [sku, categoryId, departmentId]
    grainFields: [marketKey, promotionId, sku, categoryId, departmentId]
  - <<: *staged
    sourceSystem: companion
