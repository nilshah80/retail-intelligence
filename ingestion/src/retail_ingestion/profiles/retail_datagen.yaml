  - <<: *staged
    sourceSystem: shopify
    datasetId: inventoryLevels
    sourceKeys: [inventoryItemId, locationId]
    grainFields: [inventoryItemId, locationId]
  - <<: *staged
    sourceSystem: shopify
    datasetId: inventoryQuantities
    sourceKeys: [inventoryItemId, locationId, name, observedAt]
    grainFields: [inventoryItemId, locationId, name, observedAt]
  - <<: *staged
    sourceSystem: shopify
