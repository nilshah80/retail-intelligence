# Gulf Oil India source profile -- gulf-oil-india-showcase.
#
# GOI-4. The retail profile is scenario-bound, not generic: it names the six
# Northstar source instances, their market mapping and its own extract window,
# so a Gulf run under it fails Gate A. Everything tenant-specific is replaced
# here; the `datasets` block carries over unchanged because the same generator
# emits the same dataset ids.
#
# One profile PER SCENARIO, not per tenant: Gate A rule A03 requires
# extractWindow to equal the run's logical window exactly. This one matches
# datagen/configs/gulf-oil-india-showcase.yaml (2025-08-01 .. 2026-07-31).
#
# Shopify and Business Central are SOURCE SHAPES, not a claim about Gulf's
# real estate (GOI-D2 option A). A single gulf-india market maps 1:1 from
# source to canonical; distributors arrive as stores and plants/depots as DCs
# (GOI-D1 option A).
schemaVersion: retail-source-profile/v1
profileId: gulf-oil-india-showcase
profileVersion: 1.0.0
sourceSystem: generator
sourceSchemaVersion: retail-source-config/v13
businessTimezone: source_location_timezone
extractWindow:
  start: '2025-08-01'
  end: '2026-07-31'
channelPolicy:
  mode: native
assortmentPolicy:
  mode: native_store_assortment
money:
  sourceUnit: major_decimal
  taxBasis: source_field
  currencyField: currencyCode
  taxBasisField: taxesIncluded_or_companyMarketConfiguration.taxBasis
quantityPolicy:
  mode: entity_semantics
  derivationRule: Transaction quantities are item counts; measurementUnit/measurementValue and Business
    Central unitOfMeasureCode preserve pack, weight and volume semantics.
mappingReferences:
- companyMarketConfiguration.marketCode
- locations.marketCode
- companion.marketKey
- Shopify.locationId
- BusinessCentral.locationCode
sourceInstances:
- sourceSystem: shopify
  sourceInstance: gulf-in
  logicalPathPrefix: shopify/gulf-in/
  sourceMarketId: gulf-india
  marketId: gulf-india
  currencyCode: INR
  timezone: Asia/Kolkata
  capabilities:
  - commerce
- sourceSystem: businessCentral
  sourceInstance: bc-gulf-in
  logicalPathPrefix: business-central/bc-gulf-in/
  sourceMarketId: gulf-india
  marketId: gulf-india
  currencyCode: INR
  timezone: Asia/Kolkata
  capabilities:
  - operations
- sourceSystem: companion
  sourceInstance: gulf-india
  logicalPathPrefix: companion/gulf-india/
  sourceMarketId: gulf-india
  marketId: gulf-india
  currencyCode: INR
  timezone: Asia/Kolkata
  capabilities:
  - external_signals
publicationRequirements:
  requiredCapabilities:
  - commerce
  - operations
  - external_signals
authenticity:
  mode: not_required_for_snapshot
