[project]
name = "retail-intelligence-execution"
version = "0.2.1"
description = "Source-neutral execution-profile resolution shared by Retail Intelligence jobs"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
retail_execution = ["data/v1/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
